window.SUBJECT_QUESTIONS=[{"id":1,"q":"What are the sources of law?","options":["Constitution of India","Constitution of India, judicial precedents, customary laws, statutes and ordinance","Statutes enacted by the Parliament of India and State Legislatures","Religion"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":2,"q":"Which Article in the Constitution of India, 1950 has provisions for introduction of a bill in the Parliament of India?","options":["Article 119","Article 141","Article 107","Article 243"],"ans":2,"topic":"","subject":"","sourcePage":1},{"id":3,"q":"Money Bill is introduced in which House of the Parliament?","options":["Council of People – Lok Sabha","Council of States – Rajya Sabha","Both the Houses","None of the Houses"],"ans":0,"topic":"","subject":"","sourcePage":1},{"id":4,"q":"Under what Article of the Constitution of India, 1950 is The President of India empowered to make an Ordinance?","options":["Article 243","Article 123","Article 129","Article 368"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":5,"q":"The essence of Sub-Ordinate legislation can be found in which Article of the Constitution of India, 1950?","options":["Article 12","Article 32","Article 13","Article 14"],"ans":2,"topic":"","subject":"","sourcePage":1},{"id":6,"q":"When was the Constitution of India passed by the Constituent Assembly?","options":["26th January 1950","26th November 1949","25th November 1949","15th August 1947"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":7,"q":"Which is the highest Court in India?","options":["High Court","Supreme Court of India","International Court of Justice","Sessions Court"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":8,"q":"Which Articles of the Constitution of India have the power to entertain petitions of violation of Fundamental Right?","options":["Article 32","Article 226","Article 226 and Article 32","Article 356"],"ans":2,"topic":"","subject":"","sourcePage":1},{"id":9,"q":"Which is the highest civil court in a district?","options":["Sessions Court","Supreme Court of India","District Court","High Court"],"ans":2,"topic":"","subject":"","sourcePage":1},{"id":10,"q":"Which Article of the Constitution of India empowers the legislature to make laws?","options":["Article 12","Article 243","Article 141","Article 245"],"ans":3,"topic":"","subject":"","sourcePage":1},{"id":11,"q":"When was the Supreme Court of India established?","options":["26th November 1949","26th January 1950","28th January 1950","1st October 1937"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":12,"q":"Which Article of the Constitution of India stipulates law made by the Supreme Court of India?","options":["Article 141","Article 245","Article 368","Article 352"],"ans":0,"topic":"","subject":"","sourcePage":1},{"id":13,"q":"What is the Schedule in the Constitution of India, for Separation of Subject for Legislature?","options":["9th Schedule","7th Schedule","32nd Schedule","14th Schedule"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":14,"q":"What kind of structure does the Indian Constitution have?","options":["Unitary","Federal","Autocracy","Totalitarian"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":15,"q":"Under which Article can we amend the provisions of the Constitution of India?","options":["Article 356","Article 368","Article 254","Article 245"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":16,"q":"Which is the lowest court to approach for criminal matters?","options":["Munsif Court","Judicial Magistrate","Sessions Court","District Court"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":17,"q":"Mention the number of judges in the Supreme Court of India including Chief Justice of India currently.","options":["23","32","34","46"],"ans":2,"topic":"","subject":"","sourcePage":1},{"id":18,"q":"Fundamental Rights are mentioned under which part of the Constitution of India?","options":["Part-II","Part-III","Part-IX","Part-XII"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":19,"q":"Municipalities are provided for authority under which part of the Constitution of India?","options":["Part IX","Part IXA","Part III","Part I"],"ans":1,"topic":"","subject":"","sourcePage":1},{"id":20,"q":"Under what Article of the Constitution of India, 1950 is the Governor of a State empowered to make an Ordinance?","options":["Article 123","Article 243","Article 245","Article 213"],"ans":3,"topic":"","subject":"","sourcePage":1},{"id":21,"q":"What Are Personal Laws?","options":["Laws relating to inter personal behaviour","Customs (religious beliefs) that have now been codified","Laws that a person makes","Laws based on opinion"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":22,"q":"Which Article of the Constitution of India, deal with inconsistency between laws made by Parliament and laws made by the Legislatures of States?","options":["Article 245","Article 254","Article 368","Article 32"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":23,"q":"What is a Private Bill?","options":["A bill introduced by a member other than a Minister","Bill introduced by a private citizen","Bill introduced by a Private company","A bill relating affairs which are private to individual"],"ans":0,"topic":"","subject":"","sourcePage":2},{"id":24,"q":"The Parliament for the Union of India which shall consist?","options":["The President, the Council of States (Rajya Sabha) and the House of the People (Lok Sabha)","Rajya Sabha","Lok Sabha","Legislative Assembly"],"ans":0,"topic":"","subject":"","sourcePage":2},{"id":25,"q":"Secondary/Sub-ordinate legislation cannot go beyond:","options":["The ambit of the Act","The ambit of the Act or the Constitution of India","The Constitution of India","Directive Principles of State Policy"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":26,"q":"The Appellate court for National consumer disputes redressal communication tribunal is","options":["High Court","district courts/Subordinate court","court of subordinate judge class -1","supreme court"],"ans":0,"topic":"","subject":"","sourcePage":2},{"id":27,"q":"The ancient Indian courts can be evided into six categories based on their rank as :","options":["The Gana- The Kula- The Shreni - The Nripa - the Adhikrita - The Sasita","The Kula - The Shreni - The Gana - the Adhikrita - The sasita - The Nripa","The Kula -the Adhikrita - The Gana - the Adhikrita - The sasita - The Nripa- The shreni","The Nripa -the Adhikrita- The Kula - The Gana -The shreni - The sasita"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":28,"q":"Voidable contract is one :","options":["Which is lawful","Which is invalid","Which is valid so long it is not avoided by the party entitled to do so","None of these"],"ans":2,"topic":"","subject":"","sourcePage":2},{"id":29,"q":"The difference between an advertisement for sale and a proposal is :","options":["No difference at all","That a proposal becomes a promise as soon as the party to whom it is made accepts it but an advertisement does not","Every case will be viewed according to the circumstances","None of these"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":30,"q":"In a Book depot a catalogue of books enlisting the price of each book and specifying the place where the particular book is available is :","options":["An invitation to offer","An offer","An invitation to visit the book shop","None of these"],"ans":2,"topic":"","subject":"","sourcePage":2},{"id":31,"q":"A catalogue of the goods of a company for sale ….. a series of offers but only an invitation for offers.","options":["is","is not","in normal cases is","in normal cases is not"],"ans":1,"topic":"","subject":"","sourcePage":2},{"id":32,"q":"An offer does not lapse if the :","options":["offeror dies before acceptance","The offeree dies before acceptance","Acceptance is made by the offeree in ignorance of the death of the offeror","Acceptance is made by the offeree with knowledge of the death of the offeror"],"ans":2,"topic":"","subject":"","sourcePage":3},{"id":33,"q":"A telephonic acceptance is complete when the offer is :","options":["spoken into the telephone","heard but not understood by the offeror","heard and understood by the offeror","is received, heard and understood by some person in the offeror’s house"],"ans":2,"topic":"","subject":"","sourcePage":3},{"id":34,"q":"With regard to the contractual capacity of a person of unsound mind, which one of the following statements is most appropriate?","options":["A person of unsound mind can never enter into a contract","A person of unsound mind can enter into a contract","A person who is usually of unsound mind can contract when he is, at the time of entering into a contract, of sound mind","A person who is occasionally of unsound mind can contract although at the time of making the contract, he is of unsound mind"],"ans":2,"topic":"","subject":"","sourcePage":3},{"id":35,"q":"While obtaining the consent of the promisee, keeping silence by the promisor when he has a duty to speak about the material facts, amounts to consent obtained by:","options":["Coercion","Misrepresentation","Mistake","Fraud"],"ans":3,"topic":"","subject":"","sourcePage":3},{"id":36,"q":"A’ threatened to commit suicide if his wife did not execute a sale deed in favour of this brother. The wife executed the sale deed. This transaction is:","options":["Voidable due to under influence","Voidable due to coercion","Void being immoral","Void being forbidden by law"],"ans":1,"topic":"","subject":"","sourcePage":3},{"id":37,"q":"A contract which is vitiated by undue influence is declared as which one of the following by the Indian Contract Act?","options":["Invalid","Void","Illegal","Voidable"],"ans":3,"topic":"","subject":"","sourcePage":3},{"id":38,"q":"Consider the following: 1. Active concealment of fact. 2. Promise made without any intention of performing it. 3. Breach of duty which gains an advantage to the person committing it. 4. Inducing mistakes as to subject matter. Which of the above amount to fraud?","options":["1 and 2","2 and 3","3 and 4","1 and 4"],"ans":0,"topic":"","subject":"","sourcePage":3},{"id":39,"q":"Factors vitiating consent are:","options":["Coercion, Undue influence","Fraud, Misrepresentation","Mistake","All of these"],"ans":3,"topic":"","subject":"","sourcePage":3},{"id":40,"q":"Misrepresentation means:","options":["Unwarranted assertion","Any breach of duty without an intent to deceive","Innocent mistake","All the above"],"ans":3,"topic":"","subject":"","sourcePage":3},{"id":41,"q":"If a party stands in a fiduciary relation to the other:","options":["He cannot dominate","He can dominate the will of another","The trust should be maintained","None of these"],"ans":1,"topic":"","subject":"","sourcePage":3},{"id":42,"q":"A person is deemed to be in a position to dominate the will of another if he:","options":["Holds real or apparent authority","Stands in a fiduciary relationship","Both 1 and 2","Either 1 or 2"],"ans":2,"topic":"","subject":"","sourcePage":3},{"id":43,"q":"If both the parties to a contract believe in the existence of a subject, which in fact does not exist, the agreement would be :","options":["Unenforceable","Void","Voidable","None of these"],"ans":1,"topic":"","subject":"","sourcePage":4},{"id":44,"q":"For a valid contract :","options":["Both the parties should have given their consent","The consent should be free","Both 1 and 2","Either 1 or 2"],"ans":2,"topic":"","subject":"","sourcePage":4},{"id":45,"q":"When both the parties to an agreement are under a mistake as to a matter of fact essential to an agreement, the agreement is:","options":["Void","Valid","Voidable","Illegal"],"ans":0,"topic":"","subject":"","sourcePage":4},{"id":46,"q":"In Indian Contract Act, the term consensus ad idem means :","options":["Parties under a mistake","Parties under the free consent","Parties agreeing upon the same thing in same sense","None of these"],"ans":2,"topic":"","subject":"","sourcePage":4},{"id":47,"q":"To prove undue influence, the plaintiff has to prove that:","options":["The relations, subsisting between the parties are such that the defendant was in a position to dominate the will of the plaintiff","The defendant used that position to obtain an unfair advantage from the plaintiff","Both 1 and 2","None of these"],"ans":2,"topic":"","subject":"","sourcePage":4},{"id":48,"q":"The validity of contract is not affected by :","options":["Mistake of fact","Mistake of Indian law","Misrepresentation","Fraud"],"ans":1,"topic":"","subject":"","sourcePage":4},{"id":49,"q":"Unlawful agreements comprise :","options":["Illegal agreements","Immoral agreements only","Agreements opposed to public policy only","All the agreements mentioned above"],"ans":3,"topic":"","subject":"","sourcePage":4},{"id":50,"q":"The exceptions to the rule that an agreement in restraint of trade is void, are contained in :","options":["The provisions of Sec. 27 of the Contract Act only","Secs. 11, 36, 54 and 55 of the partnership Act only","Both the above mentioned provisions of the Contract Act & Partnership Act respectively","None of the above provisions"],"ans":0,"topic":"","subject":"","sourcePage":4},{"id":51,"q":"A contract to trade with an enemy is :","options":["an immoral agreement","a valid agreement","an agreement opposed to public policy","an enforceable agreement"],"ans":2,"topic":"","subject":"","sourcePage":4},{"id":52,"q":"An agreement will be unlawful if:","options":["There is no consent","Consent is not free","There is no consideration","The object is forbidden by law"],"ans":3,"topic":"","subject":"","sourcePage":4},{"id":53,"q":"In a wagering agreement:","options":["Both the parties win","Both the parties lose","None of the parties wins","One party wins and the other looses"],"ans":3,"topic":"","subject":"","sourcePage":4},{"id":54,"q":"Which one of the following statements is correct?","options":["Void agreements are always illegal","Illegal agreements are voidable","Illegal agreement can be ratified by the parties","Illegal agreements are always void"],"ans":3,"topic":"","subject":"","sourcePage":4},{"id":55,"q":"Which one of the following is not a wagering agreement?","options":["A lottery","An agreement to buy a ticket for a lottery","Commercial transaction, the intention of which is not to deliver the goods but only to pay the difference in price","A contract of insurance"],"ans":3,"topic":"","subject":"","sourcePage":5},{"id":56,"q":"A wagering agreement in India is declared by the Contract Act as :","options":["Illegal and void","Void but not illegal","Voidable at the option of the aggrieved party","Immoral"],"ans":1,"topic":"","subject":"","sourcePage":5},{"id":57,"q":"Which one of the following is a void agreement?","options":["An agreement without consideration","An agreement in restraint of marriage","An agreement in restraint of trade","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":5},{"id":58,"q":"An agreement which restricts a person’s freedom to marry or to marry any person of his choice is against public policy and is :","options":["Lawful","Illegal","Void","None of these"],"ans":2,"topic":"","subject":"","sourcePage":5},{"id":59,"q":"An agreement of service under which an employee agrees that he will serve a particular employer for a certain duration and that he will not serve anybody else during that period, is :","options":["Valid agreement","Void agreement","Illegal agreement","None of these"],"ans":0,"topic":"","subject":"","sourcePage":5},{"id":60,"q":"If the seller agrees to supply all the goods produced by him to a certain buyer and to nobody else, and the buyer also, in turn undertakes to accept the whole of the quantity, the agreement is :","options":["Void agreement","Solus agreement","Illegal agreement","None of these"],"ans":3,"topic":"","subject":"","sourcePage":5},{"id":61,"q":"M, who is a dealer in mustard oil only, agrees to sell to N ‘500 litres of oil’. This agreement is :","options":["Valid contract","Void contract","Voidable contract","Unenforceable contract"],"ans":0,"topic":"","subject":"","sourcePage":5},{"id":62,"q":"A and B agree that A shall pay ₹1,000 for which B shall afterwards deliver to an either rice or smuggled opium.In this case :","options":["The first agreement is void and the second voidable","The first is voidable and the second is void","The first is valid and the second is void","The first is void and the second is valid"],"ans":2,"topic":"","subject":"","sourcePage":5},{"id":63,"q":"A agrees to sell to B a ‘hundred tons of oil’. There is nothing whatever to show what kind of oil was intended. The agreement is :","options":["Valid","Void for uncertainty","Voidable","Illegal"],"ans":1,"topic":"","subject":"","sourcePage":5},{"id":64,"q":"A agrees to sell to B ‘my white horse for ₹500 or ₹1,000’. There is nothing to show which of the two prices was to be given. The agreement is :","options":["Valid","Void","Voidable","Unenforceable"],"ans":1,"topic":"","subject":"","sourcePage":5},{"id":65,"q":"Agreements between a husband and wife living in friendly environment are :","options":["Valid contracts","A void contracts","Domestic arrangements","Voidable contract"],"ans":2,"topic":"","subject":"","sourcePage":5},{"id":66,"q":"A promised to marry none else than Miss B and in default to pay her a sum of ₹1,000. Subsequently A married Miss C and Miss B sued for recovery of ₹1,000. The contract is :","options":["Valid","Void","Voidable","Enforceable"],"ans":1,"topic":"","subject":"","sourcePage":5},{"id":67,"q":"A promises B to pay ₹100 if it rains on Monday, and B promises A to pay ₹100 if it does not rain on Monday. This agreement is :","options":["a valid agreement","avoidable agreement","a wagering agreement","an illegal agreement"],"ans":2,"topic":"","subject":"","sourcePage":5},{"id":68,"q":"P engages B to kill C and borrows ₹100 from D to pay B. If D is aware of the purpose of the loan, the transaction is :","options":["Valid","Void","Illegal","Not enforceable"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":69,"q":"A leaves a firm doing a particular business in Mumbai. He agrees with the other partners of the firm not to start a similar business as that of the firm in and around Mumbai for 3 years. This agreement is :","options":["Valid","Immoral","Illegal","Void"],"ans":3,"topic":"","subject":"","sourcePage":6},{"id":70,"q":"A, while filling up the insurance application form, states his age as 25 believing it to be true. His actual age was 27. The Life Insurance Corporation issued a policy in his favour charging a lower premium than what it should have charged if the actual age had been given. This is a case of :","options":["Fraud","Misrepresentation","Undue influence","Mistake of fact"],"ans":1,"topic":"","subject":"","sourcePage":6},{"id":71,"q":"B, having discovered a vein of ore on the estate of A, adopts means to conceal, and does conceal, the existence of the ore from A. Owing to A’s ignorance B is enabled to buy the estate at a low- price. The contract is :","options":["Valid","Void","Voidable at the option of A","Invalid"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":72,"q":"B let a cabin on hire to P a prostitute, knowing that it would be used for immoral purposes. The agreement is :","options":["Enforceable","Valid","Voidable","Void"],"ans":3,"topic":"","subject":"","sourcePage":6},{"id":73,"q":"A enters into an agreement with B who has robbed A of ₹10,000 to drop prosecution against him (B) in consideration of B’s returning ₹8,000. Afterwards B refused to pay. A can get from B","options":["₹ 8,000","₹ 100","Nothing","₹ 10,000 plus damages"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":74,"q":"A agrees with B to discover treasure by magic for a consideration of ₹500. This is :","options":["A void agreement","A void contract","A valid agreement","An unenforceable contract"],"ans":0,"topic":"","subject":"","sourcePage":6},{"id":75,"q":"X, a tailor, employed Y as his assistant under an agreement that Y, on termination of his employment shall not start the business of a tailor. This restraint is :","options":["Void","Valid","Illegal","Voidable"],"ans":0,"topic":"","subject":"","sourcePage":6},{"id":76,"q":"X leaves a firm doing a particular business in Delhi. He agrees with other partners of the firm not to start a similar business as that of the firm in Delhi for 2 years. This agreement is :","options":["Void","Valid","Voidable at X’s option","Invalid"],"ans":1,"topic":"","subject":"","sourcePage":6},{"id":77,"q":"X promises to supply Y one tola of gold brought from the sun. This is :","options":["a valid contract","an illegal contract","a void agreement","a voidable agreement"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":78,"q":"A promises B not to carry on a similar business as that of B if B pays him a certain amount. B pays the money but A continues to carry on the business. B can :","options":["Do nothing","Compel A to stop the business","Get him imprisoned for fraud","Sue A for damages"],"ans":0,"topic":"","subject":"","sourcePage":6},{"id":79,"q":"A purchases B’s business of selling neckties in Delhi. A can restrain B from :","options":["Doing the business of selling neckties again in his life","Doing any business in Delhi","Doing the business of selling neckties in Delhi for a limited period","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":80,"q":"A promised to marry B and none else and promised her to pay a sum of ₹5,000 in addition to what he gets from the other party if he marries someone else. A marries C and gets ₹10,000 from C. B can get from A :","options":["₹ 15,000","₹ 10,000","Nothing","₹15,000 plus damages"],"ans":2,"topic":"","subject":"","sourcePage":6},{"id":81,"q":"A promised B to obtain an employment for him in a public office. B promised to pay ₹2,000 to A for this. B gets a job through A but refuses to pay the money. A can :","options":["Challenge B’s appointment on the ground of non- payment of money","Sue B for ₹ 2,000","Do nothing","Do both given at 1 and 2"],"ans":2,"topic":"","subject":"","sourcePage":7},{"id":82,"q":"A, a Hindu already married with a living wife B, enters into a marriage agreement with a widow of 30 years of age. This agreement is :","options":["Void, because of being opposed to public policy","Valid and can be enforced by either party","Voidable, because A has obtained B’s consent by exercising undue influence against her","Void, because of being forbidden by law"],"ans":3,"topic":"","subject":"","sourcePage":7},{"id":83,"q":"Rajeev entered into a contract with Lata to marry her on a fixed date. However, before the marriage date. Rajeev went mad. With reference to the Indian Contract Act which is the valid response?","options":["Lata can’t marry till Rajeev dies","The executers of Rajeev can enforce the contract against Lata","The contract becomes void","All the statements are correct"],"ans":2,"topic":"","subject":"","sourcePage":7},{"id":84,"q":"A and B agree to deal in smuggled goods and share the profits. A refuses to give B’s share of profit. In this case:","options":["B can enforce the agreement in the court.","B can only claim damages.","B has no remedy as the contract is illegal.","B can enforce the contact or claim damages"],"ans":2,"topic":"","subject":"","sourcePage":7},{"id":85,"q":"A and B agree that law of limitation shall not apply to them. A debt becomes time barred and A refuses to pay the amount. Can B recover the amount under the terms of the agreement?","options":["yes, the agreement between them is valid and enforceable.","yes, the agreement is not opposed to public policy.","no, the agreement is a voidable agreement I and can be avoided by A.","no, the agreement falls under section 23 and hence void"],"ans":3,"topic":"","subject":"","sourcePage":7},{"id":86,"q":"A borrows ₹ 5,000 from B to purchase a revolver to shoot C. Can B recover his loan of ₹5,000.","options":["yes, the agreement between them is valid and enforceable.","yes, the agreement is not opposed to public policy.","no, the agreement is a voidable agreement and can be avoided by A.","no, the agreement falls under section 23 and hence void"],"ans":3,"topic":"","subject":"","sourcePage":7},{"id":87,"q":"A borrows from B ₹500 to bet with C. Can B recover the amount of his loan?","options":["yes, the agreement between them is collateral to a wagering agreement and hence enforceable","yes, the agreement is not opposed to public policy","no, the agreement is a voidable agreement and can be avoided by A","no, the agreement is wagering agreement and falls under section 23 and hence void"],"ans":3,"topic":"","subject":"","sourcePage":7},{"id":88,"q":"A paid ₹500 to a Government servant to get him a contract for the canteen. The Government servant could not get the contract. Can A recover ₹500 paid by him to the Government servant?","options":["yes, the agreement between them is valid and enforceable","yes, the agreement is not opposed to public policy","no, the agreement is a voidable agreement and can be avoided by A","no, the agreement is void"],"ans":3,"topic":"","subject":"","sourcePage":7},{"id":89,"q":"A person contracted to deliver a part of a specific crop of potatoes. The potatoes were destroyed by blight though no fault of the party. The contract is","options":["Valid","Voidable","Void due to frustration of contract","Illegal"],"ans":2,"topic":"","subject":"","sourcePage":7},{"id":90,"q":"A contracts to sing for B at a concert for ₹ 1,000 which are paid in advance. A is too ill to sing. Which of the following options is correct?","options":["A is bound to make compensation","A is not bound to make compensation to B for the loss of the profit which B would have made if A had been able to sing, but must refund to B ₹1,000 paid in advance","A is not liable to refund to B ₹ 1,000 paid in advance","A is liable for loss of profit as well as for refund"],"ans":2,"to n in court"],"ans":2,"topic":"","subject":"","sourcePage":14},{"id":206,"q":"In the agreement where A promises to sell his house to B for ₹5,00,000, who is the promisor?","options":["A","B","The broker","The registrar"],"ans":0,"topic":"","subject":"","sourcePage":15},{"id":207,"q":"What is the definition of a proposal (offer) under the Indian Contract Act?","options":["A mutual discussion between two parties","A legal document prepared by a lawyer","A person’s willingness to do or abstain from doing something to obtain the assent of another","A statement of intent with no expectation of acceptance"],"ans":2,"topic":"","subject":"","sourcePage":15},{"id":208,"q":"In a voidable contract, who has the right to enforce or reject the contract?","options":["The court","Both parties equally","None of the parties","One or more of the parties to the contract"],"ans":3,"topic":"","subject":"","sourcePage":15},{"id":209,"q":"According to Section 14 of the Indian Contract Act, consent is said to be free when it is not caused by:","options":["Free will","Legal advice","Coercion, undue influence, fraud, misrepresentation or mistake","Written agreement"],"ans":2,"topic":"","subject":"","sourcePage":15},{"id":210,"q":"Who is considered a competent party under the Indian Contract Act?","options":["A person aged 16 with consent","A person 18 years old, of sound mind, and not disqualified by law","A mentally unstable person","A foreign national without legal identity"],"ans":1,"topic":"","subject":"","sourcePage":15},{"id":211,"q":"An agreement which is not enforceable by law and has no legal consequences is called:","options":["Voidable Agreement","Void Agreement","Valid Contract","Contingent Contract"],"ans":1,"topic":"","subject":"","sourcePage":15},{"id":212,"q":"A has two bikes — a Hero Honda and a Bajaj Pulsar. He offers to sell his Pulsar, but does not mention which bike he is selling. B, thinking A is offering to sell his Hero Honda, accepts the offer.Based on this situation, ract. Why is this so?","options":["Because a contract between a citizen and an alien friend is not prohibited by law","Because only citizens can form valid contracts","Because aliens have no contractual rights in India","Because the contract involves social relations"],"ans":0,"topic":"","subject":"","sourcePage":16},{"id":219,"q":"A contracts with B, a local criminal, to beat his business competitor. This act is forbidden by law. What is the legal status of this agreement?","options":["It is a valid contract","It is a voidable contract","It is a void contract","It is an illegal and unenforceable contract"],"ans":3,"topic":"","subject":"","sourcePage":16},{"id":220,"q":"A enters into an agreement with B, a local criminal, to physically harm his business rival. Which essential element of a valid contract is missing here?","options":["Free consent","Lawful consideration and lawful object","Competency of parties","Offer and acceptance"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":221,"q":"When a person withdraws cash from an ATM, no words are spoken between the person and the bank, but a contract is formed. What type of contract is this?","options":["Express contract","Implied contract","Tacit contract","Void contract"],"ans":2,"topic":"","subject":"","sourcePage":16},{"id":222,"q":"In which of the following situations does a tacit contract arise?","options":["Two people signing a written agreement","One person makes an oral promise to another","A buyer places the highest bid, and the hammer falls at an auction sale","D) A contract is made before a notary public"],"ans":2,"topic":"","subject":"","sourcePage":16},{"id":223,"q":"Ajit sees a book displayed on a shelf in a bookshop with a price tag of ₹95. He offers ₹95 at the counter and asks for the book. The bookseller refuses, saying the book has already been sold. What is the correct legal position?","options":["The bookseller must sell the book to Ajit","The display of the book with a price tag is an offer, and Ajit’s payment is acceptance","The display of the book is only an invitation to offer, not a legal offer","The contract is completed when Ajit picks up the book"],"ans":2,"topic":"","subject":"","sourcePage":16},{"id":224,"q":"According to Section 25, what is the general rule regarding agreements made without consideration?","options":["They are valid","They are void","They are partially valid","They require judicial approval"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":225,"q":"Which of the following is an exception to the rule that an agreement without consideration is void?","options":["Promise made to pay a debt barred by law","Promise made for illegal activities","Promise made without any written form","Promise made between strangers"],"ans":0,"topic":"","subject":"","sourcePage":16},{"id":226,"q":"Under Section 25(1), an agreement made without consideration is valid if it is:","options":["Made verbally","Made on account of natural love and affection","Made for commercial purposes","Made only between business partners"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":227,"q":"What happens to a gift once it is completed, even if there was no consideration?","options":["It can be revoked by the giver","It cannot be recovered on the ground of absence of consideration","It becomes invalid automatically","It requires mutual consent to remain valid"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":228,"q":"What does \"remission\" in contract law mean?","options":["Complete cancellation of the contract","Lesser performance of the contract than originally agreed","Changing the terms of the contract","Performance of a contract by a third party"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":229,"q":"If a party agrees to perform less than originally promised under a contract, this is called:","options":["Novation","Rescission","Remission","Counter Offer"],"ans":2,"topic":"","subject":"","sourcePage":16},{"id":230,"q":"Can an insolvent person enter into a contract relating to his property?","options":["Yes, at any time","No, not while insolvency proceedings are ongoing","Only with creditor’s permission","Only if the contract benefits the creditors"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":231,"q":"Can a drunken or intoxicated person enter into a valid contract?","options":["No, while intoxication lasts and they are incapable of understanding the contract","Yes, at any time","Only if the contract is witnessed","Yes, if they sign in writing"],"ans":0,"topic":"","subject":"","sourcePage":17},{"id":232,"q":"A contract is not voidable because it was caused by a mistake as to any law in force in India; but mistake as to a law not in force in India has the same effect as:","options":["A mistake of case","A mistake of fact","A mistake of law","A mistake of understanding"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":233,"q":"Which of the following contracts by a company may be invalid?","options":["Contracts made within its business scope","Contracts outside the Memorandum of Association","Contracts for daily operations","Contracts signed by the CEO"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":234,"q":"In contracts involving personal skill or ability, what happens upon the death of the person?","options":["The contract continues through legal representatives","The contract is transferred to the employer","The contract is terminated","The performance is postponed"],"ans":2,"topic":"","subject":"","sourcePage":17},{"id":235,"q":"What does unauthorized material alteration in a contract lead to?","options":["Discharge of the contract","Renewal of the contract","Amendment of the contract automatically","No effect on the contract"],"ans":0,"topic":"","subject":"","sourcePage":17},{"id":236,"q":"when a part-time lecturer becomes a full-time lecturer, the earlier contract is discharged by:","options":["Breach","Performance","Agreement","Merger"],"ans":3,"topic":"","subject":"","sourcePage":17},{"id":237,"q":"if A and B plan to marry but A goes mad before the marriage, the contract becomes:","options":["Valid","Void due to impossibility of performance","Illegal","Conditional"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":238,"q":"The term “Quantum Meruit” literally means:","options":["Payment in advance","As much as is merited or earned","As per the contract terms","Payment after completion only"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":239,"q":"What are E-contracts?","options":["Contracts written and signed on paper","Contracts that are not paper-based and are electronic in nature","Verbal agreements made in person","Contracts that require physical presence of parties"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":240,"q":"What is another name for Actual Breach of Contract?","options":["Future breach","Present breach","Conditional breach","Partial breach"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":241,"q":"Where the trees were sold so that they were to be cut out and separated from land and taken away by the buyer.This sale is considered a sale of:","options":["Immovable property","Future goods only","Goods as movable property","Services, not goods"],"ans":2,"topic":"","subject":"","sourcePage":17},{"id":242,"q":"What are specific goods?","options":["Goods that are not yet manufactured","Goods identified and agreed upon at the time the contract of sale is made","Goods sold in bulk without identification","Goods that are intangible"],"ans":1,"topic":"","subject":"","sourcePage":17},{"id":243,"q":"In a contract of sale, when one table is sold out of 25 tables, under which condition would the table be considered specific goods?","options":["If the table is manufactured after the contract","If the table is not separated from the rest","If the table is delivered after payment","If the table is selected before the contract of sale is made"],"ans":3,"topic":"","subject":"","sourcePage":18},{"id":244,"q":"When the buyer does not select goods for him from a lot but the goods are defined only by description, they are called:","options":["Specific goods","Contingent goods","Unascertained goods","Future goods"],"ans":2,"topic":"","subject":"","sourcePage":18},{"id":245,"q":"where ABC agrees to sell to XYZ all the apples which will be produced in his garden next year, these apples are classified as:","options":["Future goods","Unascertained goods","Specific goods","Contingent goods"],"ans":0,"topic":"","subject":"","sourcePage":18},{"id":246,"q":"X selected some party wears in a retail showroom, agreed to take delivery next day and pay next week, but the party wears are destroyed by fire the same day, who bears the loss?","options":["The seller, because goods were not delivered","The insurance company only","No one, as the contract is void","The buyer, because property in goods had passed to him"],"ans":3,"topic":"","subject":"","sourcePage":18},{"id":247,"q":"A sends 3 dozen silk saris to B on approval or sale or return basis with an option to return within 21 days. B sends a letter of approval within 15 days. When does the sale take place?","options":["On the day B sends the letter of approval","On the day the goods were sent","On the 21st day automatically","Only after payment is made"],"ans":0,"topic":"","subject":"","sourcePage":18},{"id":248,"q":"B of Benaras writes to C of Chennai to send 50 wrist watches by parcel post. C sends the parcel with the correct address, but it is misplaced and never reaches B. Who bears the loss?","options":["C, the seller","B, the buyer","The post office","Both B and C equally"],"ans":1,"topic":"","subject":"","sourcePage":18},{"id":249,"q":"A wants to sell his typewriter and tells B, who has not seen it, that it is a brand new machine. B agrees to buy it. On delivery, the machine is found to be old and repaired. What right does B have?","options":["B must accept the machine","B can repudiate the contract and return the machine","B has no claim","B can only pay half the price"],"ans":1,"topic":"","subject":"","sourcePage":18},{"id":250,"q":"What does the warranty of freedom from encumbrances imply?","options":["The goods are of merchantable quality.","The goods are free from any charge or claim by a third party.","The goods match the sample provided.","The goods will be delivered on time."],"ans":1,"topic":"","subject":"","sourcePage":18},{"id":251,"q":"Which of the following is an example of actual delivery?","options":["The seller gives the car keys to the buyer, but the car remains in the seller’s garage.","The buyer receives an invoice but not the goods.","The seller hands over a car to the buyer directly.","The seller ships the car via courier without the buyer’s acknowledgement."],"ans":2,"topic":"","subject":"","sourcePage":18},{"id":252,"q":"What right does Section 41 of the Sale of Goods Act give to the buyer?","options":["Right to reject goods without examining them","Right to examine goods delivered to him which he has not previously examined","Right to claim damages immediately after delivery","Right to resell the goods before payment"],"ans":1,"topic":"","subject":"","sourcePage":18},{"id":253,"q":"How can a negotiable instrument be transferred?","options":["Only by delivery","Only by endorsement","By delivery or by endorsement and delivery","By sale in the market"],"ans":2,"topic":"","subject":"","sourcePage":18},{"id":254,"q":"What does “ad infinitum transfer” of a negotiable instrument mean?","options":["It can be transferred only once","It expires if transferred more than twice","It cannot be transferred","It can be transferred any number of times until its maturity"],"ans":3,"topic":"","subject":"","sourcePage":18},{"id":255,"q":"A bill drawn, accepted, or endorsed without consideration is known as:","options":["Genuine bill","Fictitious bill","Accommodation bill","Bearer bill"],"ans":2,"topic":"","subject":"","sourcePage":19},{"id":256,"q":"Which of the following is essential for a general crossing of a cheque?","options":["Two parallel transverse lines","The words “Not negotiable”","The drawer’s signature","The date of the cheque"],"ans":0,"topic":"","subject":"","sourcePage":19},{"id":257,"q":"A cheque is said to be specially crossed when:","options":["It bears two parallel transverse lines only","It is signed by the drawer","It is payable to bearer","It bears the addition of the name of a banker across its face, with or without the words “Not Negotiable”"],"ans":3,"topic":"","subject":"","sourcePage":19},{"id":258,"q":"Which of the following is true regarding special crossing?","options":["It is the same as general crossing","It restricts the payment of the cheque to a particular banker","It allows payment to any person presenting the cheque","It makes the cheque dishonorable automatically"],"ans":1,"topic":"","subject":"","sourcePage":19},{"id":259,"q":"Who is allowed to perform a double crossing?","options":["Only the banker to whom the cheque is initially crossed","Any private party presenting the cheque","The drawer of the cheque","The holder in due course"],"ans":0,"topic":"","subject":"","sourcePage":19},{"id":260,"q":"A cheque is dishonoured when:","options":["It is paid to the payee","The drawer cancels it before payment","The bank refuses to pay the amount to the payee","It is crossed generally"],"ans":2,"topic":"","subject":"","sourcePage":19},{"id":261,"q":"The Cheque Return Memo contains:","options":["The signature of the drawer","Instructions for double crossing","Bank’s profit details","Reasons for the dishonour of the cheque"],"ans":3,"topic":"","subject":"","sourcePage":19},{"id":262,"q":"How does crossing a cheque help prevent fraud?","options":["It allows the cheque to be paid to anyone","It makes the cheque non-negotiable","Misuse can be easily traced and the fraudulent person detected","It guarantees the drawer’s signature"],"ans":2,"topic":"","subject":"","sourcePage":19},{"id":263,"q":"Which of the following is a condition for a payment to be considered “in due course”?","options":["It must be made to the person in possession of the instrument and entitled to payment","It can be made to any person, regardless of possession","It can be in any form, including barter","It must be made before the maturity date"],"ans":0,"topic":"","subject":"","sourcePage":19},{"id":264,"q":"When does truncation of a cheque occur?","options":["After dishonour by the drawee bank","Only when the cheque is lost","After payment in cash across the counter","Immediately on generation of an electronic image during the clearing cycle"],"ans":3,"topic":"","subject":"","sourcePage":19},{"id":265,"q":"To whom is the payment in a promissory note made?","options":["Only to the maker","To a certain person, to the order of that person, or to the bearer of the instrument","Only to the drawer","To any person presenting it"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":266,"q":"The promise to pay in a promissory note must be:","options":["Conditional on the payee's acceptance","Unconditional and express","Payable in goods or services","Only to a bank"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":267,"q":"An instrument that is incomplete in some respect is called:","options":["Promissory Note","Escrow Instrument","Inchoate Instrument","Truncated Cheque"],"ans":2,"topic":"","subject":"","sourcePage":20},{"id":268,"q":"An Escrow Instrument is:","options":["An instrument payable immediately in cash","An instrument drawn conditionally or for a special purpose, not for transferring property","Always a promissory note","A cheque that is dishonoured"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":269,"q":"A bill of exchange without any documents relating to goods attached is called:","options":["Clean bill","Documentary bill","Inchoate instrument","Escrow instrument"],"ans":0,"topic":"","subject":"","sourcePage":20},{"id":270,"q":"What is the primary purpose of a product disclaimer?","options":["To warn buyers about any harmful side effects or dangers of the product","To promote the product’s features","To advertise the product legally","To negotiate prices with buyers"],"ans":0,"topic":"","subject":"","sourcePage":20},{"id":271,"q":"Which form of written communication presents the actual financial status of a company?","options":["Product disclaimers","Financial reporting","Marketing communications","Internal communications"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":272,"q":"In marketing communications, what must the salesperson be careful about?","options":["Using technical jargon","Being tactful and clever in word usage to avoid violating business communication laws","Speaking loudly","Avoiding all communication with customers"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":273,"q":"Why is it important to avoid beating around the bush in communication?","options":["To confuse the listener","To keep the message precise and clear","To make the conversation longer","To impress the listener"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":274,"q":"Why is feedback important in business communication?","options":["To confuse the stakeholders","To delay decision- making","To reduce communication","To ensure the listener understood the message as intended"],"ans":3,"topic":"","subject":"","sourcePage":20},{"id":275,"q":"How does proper division of labor help organizational communication?","options":["It increases workload on employees","It reduces information overload and delays in communication","It complicates communication channels","It isolates departments"],"ans":1,"topic":"","subject":"","sourcePage":20},{"id":276,"q":"Physical barriers in communication are mainly created due to:","options":["Differences in opinions","Emotional conflicts","Lack of vocabulary","Disturbances in the surroundings or environment"],"ans":3,"topic":"","subject":"","sourcePage":21},{"id":277,"q":"Who proposed the six stages of Intercultural Sensitivity?","options":["Milton Bennett","Abraham Maslow","Peter Drucker","Edward T. Hall"],"ans":0,"topic":"","subject":"","sourcePage":21},{"id":278,"q":"During the Denial stage, what is the main challenge faced by members?","options":["Over-acceptance of other cultures","Adapting too quickly to new cultures","Ignoring the existence of cultural differences","Being judgmental about others’ values"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":279,"q":"In which stage do members view the differences in culture as negative and believe their own culture is superior?","options":["Minimization","Denial","Defence","Acceptance"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":280,"q":"Advertising through newspapers, magazines, and brochures is called:","options":["Broadcast Advertising","Outdoor Advertising","Print Media Advertising","Digital Advertising"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":281,"q":"Which type of report presents only facts about an activity without any note or suggestions?","options":["Analytical Report","Research Report","Information Report","Special Report"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":282,"q":"Reports that are based on research conducted on a particular problem are known as:","options":["Information Reports","Research Reports","Routine Reports","Statutory Reports"],"ans":1,"topic":"","subject":"","sourcePage":21},{"id":283,"q":"Which of the following is considered good telephone etiquette?","options":["Calling clients at odd hours","Using warm greetings like \"Good morning\" and \"Thank you\"","Giving long, unstructured explanations","Interrupting the client frequently"],"ans":1,"topic":"","subject":"","sourcePage":21},{"id":284,"q":"A seller sends a letter providing details about price, quality, and terms of sale after receiving an enquiry. This is known as:","options":["Complaint Letter","Recovery Letter","Quotation Letter","Order Letter"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":285,"q":"One of the primary reasons businesses write and draft messages is to:","options":["Entertain their employees","Inform, persuade, and create goodwill","Confuse competitors","Delay decision- making"],"ans":1,"topic":"","subject":"","sourcePage":21},{"id":286,"q":"Building trust among stakeholders and developing company reputation is mainly part of:","options":["Informing","Persuading","Creating Goodwill","Reporting"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":287,"q":"Effective communication with customers helps a business by:","options":["Reducing customer satisfaction","Damaging business reputation","Enhancing customer satisfaction and reputation","Ignoring customer needs"],"ans":2,"topic":"","subject":"","sourcePage":21},{"id":288,"q":"Courteous communication helps in:","options":["Showing superiority of one team over another","Maintaining healthy working relationships","Ignoring others’ opinions","Using harsh and direct language"],"ans":1,"topic":"","subject":"","sourcePage":21},{"id":289,"q":"What is essential for the speaker to avoid miscommunication?","options":["Speaking rapidly and emotionally","Delivering the message in a concrete and clear manner","Using technical jargon","Avoiding examples"],"ans":1,"topic":"","subject":"","sourcePage":21},{"id":290,"q":"A debate is usually based on:","options":["Current affairs or specific situations","Imaginative storytelling","Poetry and creative writing","Historical speeches"],"ans":0,"topic":"","subject":"","sourcePage":21}];
