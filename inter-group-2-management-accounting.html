window.SUBJECT_QUESTIONS=[{"id":1,"q":"Management Accounting __________________.","options":["Accumulates, summarizes and analyses the available data.","Is primarily concerned with the requirements of the management.","Makes Corporate Planning and Strategy effective.","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":2,"q":"Management accounting can be viewed as________________.","options":["Marketing-oriented Accounting","Management- oriented Accounting","Accounting-oriented Management","Manager-oriented Accounting"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":3,"q":"The main objective of management accounting is ___________________.","options":["To maintain the accounting records","To know the amount due from customers and suppliers","To ascertain analyse and interpret the results of business operations","To record all the business transactions"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":4,"q":"is the study of managerial aspects of financial accounting _________________.","options":["Cost accounting","Financial accounting","Management accounting","Business accounting"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":5,"q":"The purpose of management accounting is to help make decisions","options":["Managers","Investors","Marketers","Banks"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":6,"q":"Management accounting assists the management in","options":["Planning","Directing","Controlling","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":7,"q":"‘Period of lost relevance’ is the of the evolution of management accounting.","options":["1st stage","2nd stage","3rd stage","4th stage"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":8,"q":"__________________ criteria are a set of standards for a company’s behaviour used by socially conscious investors to screen potential investments.","options":["JIT","AMT","ESG","ABC"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":9,"q":"Management accounting information helps managers formulate strategy by answering which of the following questions?","options":["Who are the most important customers, and how can the company deliver value to the customers?","What is most critical capability of the company which may be technology, production, or marketing?","How can we leverage it for new strategic initiatives?","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":10,"q":"Management accounting with specific focus on environmental issues is becoming increasingly important in organizations as environmental costs are large in many organisations. There are three specific reasons for this, which are___________________.","options":["Environmental costs are often high in the many manufacturing organisations","Regulatory requirements often impose huge fines for non-compliance","Both 1 and 2","Companies are increasingly realizing that being socially and environmentally responsible declines their image and this has positive impact on their bottom line."],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":11,"q":"Management accounting is concerned with data collection from _____________.","options":["internal sources","external sources","internal and external sources","nternal or external sources"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":12,"q":"Management Accounting is concerned with accounting information, which is useful to the management — This definition is given by ______________.","options":["Robert N. Antho","Brown and Howard","CIMA","The Institute of Chartered Accountants of England and Wales"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":13,"q":"The primary objective of Management Accounting is to _______________.","options":["maximize profits","minimize losses","maximize profits or minimize losses","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":14,"q":"Which of the following is a correct definition of activity-based management?","options":["An approach to the costing and monitoring of activities which involves tracing resource consumption and costing final outputs. Resources are assigned to activities and activities to cost objects based on consumption estimates. The latter utilize cost drivers to attach activity costs to outputs.","The identification and evaluation of the activity drivers used to trace the cost of activities to cost objects. It may also involve selecting activity drivers with potential to contribute to the cost management function with particular reference to cost reduction","A method of budgeting based on an activity framework and utilizing cost driver data in the budget- setting and variance feedback processes.","A system of management which uses activity-based cost information for a variety of purposes including cost reduction, cost modeling and customer profitability analysis"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":15,"q":"Which of the following characteristics would be an indicator that a company would benefit from switching to activity based costing?","options":["Only one homogenous product is produced on a continuous basis","The existing cost system is reliable and has produced excellent results","Overhead costs are high and increasing and no one seems to know why","The costs of implementing ABC out-weigh the benefits"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":16,"q":"According to the Chartered Institute of Management Accountants (CIMA), cost attribution to cost units on the basis of benefits received from indirect activities e.g. ordering, setting up, and assuring quality is known as:","options":["Absorption costing","Marginal costing","Activity-based costing","Job costing"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":17,"q":"In an ABC system, which of the following is likely to be classified as a batch level activity?","options":["Machine set-up","Product design","Inspection of every item produced","Production manager’s work"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":18,"q":"Activity based costing","options":["Uses a plant wide overhead rate to assign overhead","Is not expensive to implement","Typically applies overhead costs using direct labour hours","Uses multiple activity rates"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":19,"q":"Which of the following activities is not a batch level activity?","options":["Processing purchase orders","Designing products","Receive raw materials from suppliers","Setting up equipment"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":20,"q":"Which of the following is not included in batch level activities?","options":["Material ordering cost","Machine set-up cost","Inspection cost","Designing the product"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":21,"q":"Assigning overhead using ABC often:","options":["Shifts overhead costs from high-volume products to low- volume products","Shifts overhead costs from low- volume products to high-volume products","Provides the same results as traditional costing","Requires one predetermined overhead rate"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":22,"q":"In Activity Based Costing","options":["Non-manufacturing costs may not be assigned to products","Some manufacturing costs may be excluded from product costs","Allocation bases are the same as those used in traditional costing methods","Similar to traditional costing, ABC only uses one overhead cost pool"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":23,"q":"In an ABC system, the allocation bases that are used for applying costs to services or procedures are called:","options":["Cost Pool","Cost Driver","Cost Absorption","Cost Object"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":24,"q":"Which of the following would not be deducted from sales in a management report prepared using ABC?","options":["Direct materials","Direct labour","Variable selling and administration costs","Shipping costs"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":25,"q":"an item for which cost measurement is required e.g. product, job or a customer","options":["Cost Pool","Cost Driver","Cost Absorption","Cost Object"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":26,"q":"Which of the following is different in ABC when compared to traditional costing?","options":["Traditional costing and ABC costing usually yield very similar product costs","In an ABC costing system, costs are only assigned to products that actually required work that gave rise to a particular cost","In ABC, batch-level costs are applied to products using unit- level bases","Under traditional costing, batch-level costs are shifted from high-volume products to low- volume products"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":27,"q":"Process of Cost allocation under Activity Based Costing is","options":["Cost of Activities—Activities —Cost Driver – Cost allocated to cost objects","Cost Driver — Cost of Activities— Cost allocated to cost objects – Activities","Activities— Cost of Activities—Cost Driver – Cost allocated to cost objects","Activities—Cost Driver – Cost allocated to cost objects — Cost of Activities"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":28,"q":"Cost of maintaining a building is:","options":["Unit Level Cost","Batch Level Cost","Product Level Cost","Facility Level Cost"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":29,"q":"should be subtracted from net product revenues instead of an arbitrary and illogical apportionment.","options":["Facility Level Cost","Product Level Cost","Organizational Level Cost","High Level Cost"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":30,"q":"The basis of apportionment of overheads which takes into account the profitability of various departments is called:","options":["FIFO basis","LIFO basis","Ability to pay basis","Activity basis"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":31,"q":"Which of the following is the main cost driver of customer order processing activity?","options":["Flow of the product from the assembly line","Order value","Number of problem suppliers","Number of machine charges"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":32,"q":"Painting the product would be an example of which activity level groups","options":["Facility-level activity","Product-level activity","Unit-level activity","Batch-level activity"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":33,"q":"Which of the following tasks is not normally associated with an activity-based costing system?","options":["Calculation of cost application rates","Identification of cost pools","Preparation of allocation matrices","Identification of cost drivers"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":34,"q":"All of the following are examples of batch level activities except:","options":["Purchase order processing","Setting up equipment","The clerical activity associated with processing purchase orders to pro-duce an order for a standard product","Worker recreational facilities"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":35,"q":"A cost driver -","options":["is a force behind the overhaed cost","is an allocation base","is a transaction that is a significant determinant of cost","is all of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":36,"q":"Which of these is NOT a cost driver For the Activity Design of products, services & Processes ?","options":["Number of Products in design","Number of Parts per product","Number of employee Training Programmes","Number of engineering Hours"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":37,"q":"Which of these in NOT a Cost driver for Marketing and sales Function ?","options":["Number of advertisements/Inserti ons","Number of researche projects","Number of Sales personnel","sales Revenue"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":38,"q":"Which of these in NOT a Cost driver for Customer Service Activity ?","options":["Number of service calls","Number of Products serviced","Hours spent on servicing products","sales Revenue"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":39,"q":"Plant depreciation is an example of which activity-level group?","options":["Unit-level activity","Facility-level activity","Batch-level activity","Product-level activity"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":40,"q":"Under activity-based costing, ‘material ordering’ is considered as —","options":["Unit-level activity","Facility-level activity","Batch-level activity","Product-level activity"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":41,"q":"Samsung an appliance manufacturer is developing a new line of ovens that uses controlled-laser technology. Research and testing costs associated with the new ovens is said to arise from a:","options":["Unit Level Activity","Competitive Level Activity","Facility Level Activity","Product Sustaining Activity"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":42,"q":"A homogeneous cost pool is one that:","options":["Does not change over time","Needs many activity drivers to be allocated to a cost object","Can be explained with a single activity driver","Has only one type of material assigned to it"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":43,"q":"An Activity-Based Costing, an inspection of the product is a level activity:","options":["Unit","Batch","Product","Facility"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":44,"q":"A company uses traditional standard costing system. The inspection and set-up costs are actually ₹1,760 against a budget of ₹2,000. ABC system is being implemented and accordingly the number of batches is identified as the cost driver for inspection and set up. The budgeted production is 10,000 units in batches of 1,000 units whereas actually 9,000 units were produced in 11 batches. The cost per batch under ABC system will be","options":["₹ 160","₹ 200","₹ 180","₹ 220"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":45,"q":"X Company uses activity-based costing for Product B and Product D. The total estimated overhead cost for the parts administration activity pool was ₹5,50,000 and the expected activity was 2000 part types. If Product D requires 1200 part types, the amount of overhead allocated to product D for parts administration would be:","options":["₹ 2,75,000","₹ 3,00,000","₹ 3,30,000","₹ 3,45,000"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":46,"q":"Fast Ltd. manufactures three types of products A, B, and C following ABC System. During a period, the company incurred ₹73,000 as inspection cost and it was worked for 10, 20 and 9 production runs respectively for producing products A, B, and C. The inspection costs for product B under the ABC system was","options":["₹ 15,000","₹ 40,000","₹ 18,000","₹ 24,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":47,"q":"A company operates an activity based costing (ABC) system to attribute its overhead costs to cost objects. In its budget for the year- ending 31st August, 2022. The company expected to place a total of 2000 purchase orders at a total cost of ₹1,00,000. This activity and its related costs were budgeted to occur at a constant rate throughout the budget year which is divided into 13 four week periods. During the four-week period ended 30th June 2021, a total of 200 purchase orders were placed at a cost of ₹ 9,000. The over recovery of these costs for the four-week period was","options":["₹ 2,000","₹ 3,000","₹ 1,500","₹ 1,000"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":48,"q":"A company manufactures 500 units of product AX the material cost to manufacture is ₹ 1,50,000, Labour cost ₹2,65,000. Material reordering cost is ₹4,500, Material handling cost is ₹2,500 Material order – 35, Material movement – 20. Total Material cost under Activity based costing is.","options":["₹ 554","₹ 4,22,000","₹ 1,57,000","₹ 1,084"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":49,"q":"To obtain the break-even point in rupee sales value, total fixed costs are divided by:","options":["Variable cost per unit;","Contribution margin per unit;","Fixed cost per unit;","Profit/volume ratio."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":50,"q":"The break-even point is the point at which:","options":["There is no profit, no loss;","Contribution margin is equal to total fixed cost;","Total revenue is equal to total cost;","All of the above."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":51,"q":"The primary difference between a fixed budget and a variable (flexible) budget is that a fixed budget:","options":["includes only fixed costs, while a variable budget includes only variable costs.","is concerned with only further acquisitions of fixed costs, while a variable budget is concerned with expenses which vary with sales.","cannot be changed after the period begins, while a variable budget can be changed after the period begins.","is a plan for a single level of sales (or other measure of activity), while a variable budget consists of several plans, one for each of several levels of sales (or other measures of activity)."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":52,"q":"Margin of safety is referred to as:","options":["Excess of actual sales over fixed expenses;","Excess of actual sales over variable expenses;","Excess of actual sales over break-even sales;","Excess of budgeted sales over fixed costs."],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":53,"q":"Contribution margin is known as","options":["Marginal income","Gross profit","Net income","Net profit"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":54,"q":"Fixed cost per unit decrease when","options":["Production volume increases","Production volume decreases","Variable costs per unit decreases","Prime costs per unit decreases"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":55,"q":"Within a relevant range, the amount of variable costs per unit","options":["Differs at each production level","Remains constant at each production level","Increases as production increases","Decreases as production increases"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":56,"q":"Margin of safety is referred to as","options":["Excess of budgeted or actual sales over the variable expenses and fixed expense, at break-even.","Excess of budgeted or actual sales revenue over the fixed expenses.","Excess of actual sales over budgeted sales.","Excess of sales revenue over the variable expenses"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":57,"q":"Under marginal costing system, the contribution margin discloses the excess of","options":["Revenue over fixed costs","Projected revenues over the break-even point","Revenues over variable costs","Variable costs over fixed costs"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":58,"q":"A decrease in sales price","options":["does not affect the break-even point","lowers the fixed cost","Increases the break- even point","lowers the break- even point"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":59,"q":"Determine Margin of safety if Profit is ₹15,000 and P/V ratio is 40%.","options":["₹ 37,500","₹ 33,000","₹ 38,000","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":60,"q":"What is Margin of Safety if Sales is 20,000 units and B.E.P is 15,000 units?","options":["15000 units","5000 units","10000 units","20000 units"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":61,"q":"Determine sales in rupees for desired profit if fixed cost is ₹10,000, Variable cost is ₹30,000, Sales is ₹50,000 and desired profit is ₹5,000.","options":["₹ 73,500",". ₹75,000","₹ 5,000","₹ 37,500"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":62,"q":"What will be sales in rupees for desired profit if fixed cost is ₹30,000, desired profit is ₹15,000 and P/V ratio is 30%?","options":["₹ 1,50,000","₹ 1,00,000","₹ 2,00,000","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":63,"q":"Calculate sales in rupees for desired profit if fixed cost is ₹10,000, selling price is ₹20 per unit, Variable cost is ₹15 per unit and desired profit is ₹1 per unit","options":["₹ 20,000","₹ 50,000","₹ 70,000","₹ 10,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":64,"q":"Determine sales in units for desired profit if Fixed cost is ₹15,000, desired profit is ₹5,000 Selling price per unit is ₹20 and Variable cost per unit is ₹16.","options":["₹5,000 units","₹ 5,000","₹ 10,000","₹10,000 units"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":65,"q":"What will be sales in units if fixed cost is ₹50,000 Contribution per unit is ₹60 and desired profit per unit is ₹10.","options":["₹6,000 units","₹ 1,000","₹1,000 units","₹ 6,000"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":66,"q":"9. Determine B.E.P in units and amount if Units produced if ₹10,000, Fixed cost is ₹40,000, Selling price is ₹50 per unit and Variable cost us ₹30 per unit.","options":["₹40 per unit, ₹2,00,000","₹50 per unit, ₹10,00,000","₹20 per unit, ₹1,00,000","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":67,"q":"Determine B.E.P if Sales is ₹1,00,000, Variable cost is ₹50,000 and Profit is ₹20,000.","options":["₹ 60,000","₹ 40,000","₹ 80,000","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":68,"q":"Pv ratio will increase if there is -","options":["a decrease in fixed cost","an increase in fixed cost","a decrease in selling price per unit","a decrease in variable cost per unit"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":69,"q":"Under marginal costing ,the cost of product for inventory valuation includes","options":["prime costs and variable factory overheads","prime cost only","prime costs and Fixed factory overheads","prime costs and all factory overheads"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":70,"q":"period costs are :","options":["variable cost","fixed cost","prime cost","overheads cost"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":71,"q":"Marginal costs is taken as equal to","options":["Prime Cost plus all variable overheads","Prime Cost minus all variable overheads","Variable overheads","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":72,"q":"Contribution margin is equal to","options":["Sales - Fixed Cost - Profit","Profit + Variable Cost","Fixed Cost - Loss","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":73,"q":"It is pallned sell 1,00,000 units of product A at ₹12 per unit. Fixed Costs are ₹2,80,000 .To achive a profit of ₹2,00,000 what would the variable costs be ?","options":["₹ 4,80,000","₹ 7,20,000","₹ 9,00,000","₹ 9,20,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":74,"q":"Factors which can change the break even point","options":["change in total fixed costs","change in variable costs per unit","change in the selling price per unit","All of the above."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":75,"q":"net profit ratio is 12% and bep is 40 % of total sales compute pv ratio","options":["60%","52%","28%","20%"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":76,"q":"If the total cost of 1000 units is ₹ 60,000 and that of 1001 units is ₹60,400, then the increase of ₹400 in the total cost is:","options":["Prime cost","All variable overheads","Marginal cost","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":77,"q":"Which of the following statements are true about marginal costing?","options":["In marginal costing, fixed costs are treated as product costs","Marginal costing is not an independent system of costing","The elements of cost in marginal costing are divided into fixed and variable components","Both b and c"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":78,"q":"The costing method where fixed factory overheads are added to inventory is called:","options":["Activity-based costing","Absorption costing","Marginal costing","All of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":79,"q":"While computing profit in marginal costing:","options":["The fixed cost gets added to the contribution","The total marginal cost gets deducted from total sales revenue","The total marginal cost gets added to total sales revenue","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":80,"q":"Which of the following assumptions are made while calculating marginal cost","options":["Total fixed cost is constant at all levels of output","Total variable cost varies according to the volume of output","All elements of cost can be divided into fixed and variable components","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":81,"q":"Contribution margin in marginal costing is also known as:","options":["Net income","Gross profit","Marginal income","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":82,"q":"What is the opportunity cost of making a component part in a factory given no alternative use of the capacity?","options":["The variable manufacturing cost of the component","The total manufacturing cost of the component","The total variable cost of the component","Zero"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":83,"q":"The difference in total cost that results from two alternative courses of action is called:","options":["Relevant Cost","Opportunity Cost","Differential Cost","Marginal Cost"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":84,"q":"Relevant costs are:","options":["unavoidable, future and measured by cash","avoidable, future and measured by cash","avoidable, future and measured by profit","unavoidable, future and measured by profit"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":85,"q":"The profit at which total revenue is equal to the total cost is known as:","options":["Margin of safety","Break-even point","Both a and b are incorrect","Both a and b are correct"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":86,"q":"Which of the following costs would not be accounted for in a company’s recordkeeping system?","options":["an unexpired cost","an expired cost","a product cost","an opportunity cost"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":87,"q":"PQR Ltd. manufactures a single product which it sells for ₹ 40 per unit. Fixed cost is ₹ 60,000 per year. The contribution to sales ratio is 40%. PQR Ltd.’s Break Even Point in units is","options":["3500","3700","3750","4000"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":88,"q":"The break-even point of a manufacturing company is ₹1,60,000. Fixed cost is ₹48,000. Variable cost is ₹12 per unit. The PV ratio will be:","options":["20%","40%","30%","25%"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":89,"q":"Product A generates a contribution to sales ratio of 40%. Fixed cost directly attributable to Product A amounted to ₹60,000. The sales revenue required to achieve a profit of ₹15,000 is","options":["₹ 2,00,000","₹ 1,85,000","₹ 1,87,500","₹ 2,10,000"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":90,"q":"XYZ Ltd. makes a special gadget for the car it manufactures. The machine for the gadget works to full capacity and incur ₹15 Lakhs and ₹40 Lakhs respectively as Variable and Fixed Costs. If all the gadgets were purchased from an outside supplier, the machine could be used to produce other items, which would earn a total contribution of ₹ 25 Lakhs. What is the maximum price that XYZ Ltd. should be willing to pay to the outside supplier for the gadgets, assuming there is no change in Fixed Costs?","options":["₹40 Lakhs","₹65 Lakhs","₹25 Lakhs","₹15 Lakhs"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":91,"q":"X Ltd. has 1000 units of an obsolete item which are carried in inventory at the es P/V ratio","It affects stock value"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":239,"q":"In make-or-buy decisions using marginal costing, which cost is always relevant?","options":["Allocated head office expenses","Sunk cost","Variable production cost","Apportioned rent"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":240,"q":"A division transfers goods internally at marginal cost. What is a key disadvantage?","options":["Overstatement of division’s profit","Under-recovery of fixed costs","Double counting of variable cost","Increased total cost"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":241,"q":"Which decision is most appropriate to use marginal costing?","options":["Choosing depreciation method","Selecting supplier for raw material","Adding a new product line under capacity","Evaluating internal audit risk"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":242,"q":"When marginal cost equals transfer price, the transferring division will likely:","options":["Make excess profit","Break even","Show zero contribution","Lose incentive to transfer"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":243,"q":"If internal transfers are made at marginal cost, which division may feel disadvantaged?","options":["Buying division","Corporate center","Selling division","Marketing department"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":244,"q":"Sales = ₹5,00,000, variable costs = ₹3,00,000, fixed costs = ₹1,00,000. What is margin of safety?","options":["₹ 1,00,000","₹ 2,50,000","₹ 1,25,000","₹ 50,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":245,"q":"Fixed cost = ₹80,000, break-even sales = ₹2,00,000. If sales rise to ₹3,00,000, what is profit?","options":["₹ 20,000","₹ 40,000","₹ 60,000","₹ 80,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":246,"q":"A firm produces 5,000 units at total cost ₹1,50,000; at 6,000 units, total cost ₹1,70,000. Marginal cost per unit?","options":["₹ 20","₹ 40","₹ 25 ePage":""},{"id":283,"q":"The DuPont analysis breaks down ROI into:","options":["Profit margin and asset turnover","Profit margin and sales growth","Asset turnover and working capital","Net income and equity"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":284,"q":"Division A has operating profit ₹20 lakhs and average operating assets ₹1 crore. Division B has operating profit ₹15 lakhs and average operating assets ₹75 lakhs. Which division has a higher ROI?","options":["Division A: 20%, Division B: 20%","Division A: 25%, Division B: 20%","Division A: 20%, Division B: 25%","Division A: 15%, Division B: 18%"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":285,"q":"Division X has operating profit of ₹30 lakhs and operating assets of ₹1.5 crore. Cost of capital is 15%. Calculate Residual Income (RI).","options":["₹9.5 lakhs","₹4.5 lakhs","₹7.5 lakhs","₹10 lakhs"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":286,"q":"Division C’s sales are ₹50 lakhs; net operating profit ₹8 lakhs; average operating assets ₹40 lakhs. Calculate ROI.","options":["10%","20%","14%","18%"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":287,"q":"Division D’s net operating profit after tax (NOPAT) is ₹12 lakhs. Capital charge @ 18% on ₹50 lakhs capital employed. Calculate Economic Value Added (EVA).","options":["₹3.6 lakhs","₹6 lakhs","₹4.5 lakhs","₹3 lakhs"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":288,"q":"Division Q’s ROI is 18%. Cost of capital is 12%. Should Division Q accept a project with an ROI of 14%?","options":["Yes, because project ROI > cost of capital","No, because project ROI < divisional ROI","Yes, if project is short term","No, because project ROI < 20%"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":289,"q":"Which of the following is NOT a responsibility center?","options":["Cost center","Profit center","Investment center","Tax center"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":290,"q":"Which of the following is NOT true about responsibility accounting?","options":["Encourages accountability","Helps in performance evaluation","Eliminates all cost variances","Facilitates decentralization"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":291,"q":"In responsibility accounting, controllable costs are:","options":["Costs over which a manager has direct influence","Fixed costs only","Sunk costs","Costs that cannot be controlled"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":292,"q":"Profit center managers are responsible for:","options":["Costs only","Revenues only","Both revenues and costs","Investment decisions"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":293,"q":"Which responsibility center allows managers to make decisions on assets employed as well as profits?","options":["Cost center","Profit center","Investment center","Expense center"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":294,"q":"Which decision-making criterion assumes the decision maker is extremely risk-averse?","options":["Maximax","Maximin","Minimax regret","Expected value"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":295,"q":"The maximax criterion is also known as:","options":["Optimistic criterion","Pessimistic criterion","Minimax regret","Laplace criterion"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":296,"q":"The minimax regret criterion minimizes:","options":["The maximum payoff","The maximum loss relative to the best payoff in each state","The expected value","The minimum loss"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":297,"q":"Expected monetary value (EMV) is calculated by:","options":["Multiplying the payoff by the probability and summing for all states","Taking the maximum payoff","Subtracting costs from revenues","Dividing total payoff by the number of alternatives"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":298,"q":"Which of the following decision rules is suitable when probabilities of states of nature are unknown and the decision maker is neutral?","options":["Maximin","Maximax","Laplace (Equal probability)","Minimax regret"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":299,"q":"In decision theory, a ‘payoff table’ shows:","options":["Probabilities of states of nature","Outcomes for each alternative under each state of nature","Only the best outcome","Budgeted costs and revenues"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":300,"q":"The Laplace criterion assumes:","options":["Decision maker is pessimistic","Decision maker assigns equal probabilities to all states of nature","Probabilities are known precisely","Focus only on worst outcomes"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":301,"q":"A decision tree is useful because it:","options":["Simplifies complex decisions by structuring alternatives and outcomes sequentially","Ignores probabilities","Always leads to optimistic decisions","Is used only for investment decisions"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":302,"q":"Sensitivity analysis in decision theory helps to:","options":["Evaluate how changes in probabilities or payoffs affect the decision","Eliminate bad alternatives","Predict exact future outcomes","Decide the cost of alternatives"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":303,"q":"The ‘Expected Value of Perfect Information (EVPI)’ represents:","options":["The cost of obtaining perfect information","The maximum amount a decision maker would pay to eliminate uncertainty","The average payoff","The minimum payoff"],"ans":1,"topic":"","subject":"","sourcePage":""}];
