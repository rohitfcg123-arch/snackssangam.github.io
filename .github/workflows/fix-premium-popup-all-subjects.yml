name: Fix Premium Popup On All Subjects

on:
  push:
    paths:
      - ".github/workflows/fix-premium-popup-all-subjects.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch subject access popup
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if grep -Fq 'showNotice("Free access allows only "+state.maxQuestions+" questions. Please reduce the question count or purchase full access.");' "$file"; then
              python3 - "$file" <<'PY'
import pathlib, sys
p=pathlib.Path(sys.argv[1])
s=p.read_text()
old='showNotice("Free access allows only "+state.maxQuestions+" questions. Please reduce the question count or purchase full access.");'
new='if(typeof cmaShowAccessPopup==="function") cmaShowAccessPopup("Free access allows only "+state.maxQuestions+" questions. Please reduce the question count or purchase full access."); else showNotice("Free access allows only "+state.maxQuestions+" questions. Please reduce the question count or purchase full access.");'
s2=s.replace(old,new)
if s2 != s:
    p.write_text(s2)
PY
              changed=1
              echo "Patched: $file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.html' -print0)

          if [ "$changed" -eq 0 ]; then
            echo "No remaining subject files needed this patch."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Show premium/free choice popup across subjects"
          git push
