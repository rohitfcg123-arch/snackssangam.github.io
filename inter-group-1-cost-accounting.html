,"subject":"","sourcePage":""},{"id":219,"q":"In sugar manufacturing industry molasses is also produced along with sugar. Molasses may be of small value as compared with the value of sugar and is known as:","options":["Joint product","Common product","By-product","None of them"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":220,"q":"Method of apportioning joint costs on the basis of output of each joint product at the point of split-offs is known as:","options":["Physical unit method","Sales value method","Average cost method","Marginal cost and contribution method"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":221,"q":"The main purposes of accounting of joint products and by-products is to:","options":["Determine the replacement cost","Determine the opportunity cost","Determine profit or loss on each product line","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":222,"q":"Under net realisable value method of apportioning joint costs to joint products, the selling & distribution cost is:","options":["Ignored","Deducted from sales value","Deducted from further processing cost","Added to joint cost"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":223,"q":"Which of the following is an example of by-product:","options":["Mustard seeds and mustard oil","Diesel and Petrol in an oil refinery","Edible oils and oil cakes","Curd and butter in a diary"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":224,"q":"Which of following methods can be used when the joint products are of unequal quantity and used for captive consumption:","options":["Physical units method","Net realisable value method","Technical estimates, using market value of similar goods","Market value at spit- off method"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":225,"q":"Cost of a particular service under operating costing is ascertained by preparing:","options":["Cost sheet","Process account","Job cost sheet","Production account"],"ans":2, mposite cost units 3. Use of equivalent units","options":["(1) only","(1) and (2) only","(2) only","(2) and (3) only"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":238,"q":"Which of the following organisations should not be advised to use service costing?","options":["Distribution service","Hospital","Maintenance division of a manufacturing company","A light engineering company"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":239,"q":"In case of joint products, the main objective of accounting of the cost is to apportion the joint costs incurred up to the split off point. For cost apportionment one company has chosen Physical Quantity Method. Three joint products ‘A’, ‘B’ and ‘C’ are produced in the same process. Up to the point of split off the total production of A, B and C is 60,000 kg, out of which ‘A’ produces 30,000 kg and joint costs are Rs. 3,60,000. Joint costs allocated to product A is:","options":["Rs. 1,20,000","Rs. 60,000","Rs. 1,80,000","None of the these"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":240,"q":"A transport company is running five buses between two towns, which are 50 kms apart. Seating capacity of each bus is 50 passengers. Actually passengers carried by each bus were 75% of seating capacity. All buses ran on all days of the month. Each bus made one round trip per day. Passenger kms are:","options":["2,81,250","1,87,500","5,62,500","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":241,"q":"The cost of a product under marginal costing system includes:","options":["Prime cost plus variable overhead","Prime cost plus fixed overhead","Prime cost plus factory overhead","Only prime cost"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":242,"q":"The difference between absorption costing and marginal costing is in regard to the treatment of:","options":["Direct materials","Fixed overhead","Prime cost","Variable overhead"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":243,"q":"Fixed costs are treated as :","options":["Overhead costs","Prime costs","Period costs","Conversion costs"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":244,"q":"When sales and production (in units) are same then profits under :","options":["Marginal costing is lower than that of absorption costing","Marginal costing is higher than that of absorption costing","Marginal costing is equal to that of absorption costing","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":245,"q":"When sales exceeds production (in units) then profit under:","options":["Marginal costing is higher than that of absorption costing","Marginal costing is equal to that of absorption costing","Marginal costing is lower than that of absorption costing","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":246,"q":"which of the following factors responsible for change in the break even point?","options":["change in selling price","change in variable cost","change in fixed cost","all of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":247,"q":"Variable cost -","options":["Remains fixed in total","Remains fixed per unit","Varies per unit","Nor increase or decrease"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":248,"q":"Marginal Costing technique follows the following basic of classification:","options":["Element wise","Function Wise","Behaviour wise","Identifiability wise"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":249,"q":"P/V ratio will increase if the:","options":["There is a decrease in fixed cost","There is an increase in fixed cost","There is a decrease in selling price per unit.","There is a decrease in variable cost per unit."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":250,"q":"The technique of differential cost is adopted when:","options":["To ascertain P/V ratio","To ascertain marginal cost","To ascertain cost per unit","To make choice between two or more alternative courses of action"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":251,"q":"Which of the following would not be used to estimate standard direct material prices?","options":["The availability of bulk purchase discounts","Purchase contracts already agreed","The forecast movement of prices in the market","Performance standards in operation"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":252,"q":"What is an attainable standard?","options":["A standard which includes no allowance for losses, waste and inefficiencies. It represents the level of performance which is attainable under perfect operating conditions","A standard which includes some allowance for losses, waste and inefficiencies. It represents the level of performance which is attainable under efficient operating conditions","A standard which is based on currently attainable operating conditions","A standard which is kept unchanged, to show the trend in costs"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":253,"q":"Budgets are shown in-Terms:","options":["Qualitative","Quantitative","Materialistic","both (b) and (c)"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":254,"q":"Which of the following is not an element of master budget?","options":["Capital Expenditure Budget","Production Schedule","Operating Expenses Budget","All above the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":255,"q":"Which of the following is not a potential benefit of using a budget?","options":["Enhanced coordination of firm activities","More motivated managers","Improved inter- departmental communication","More accurate external financial statements"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":256,"q":"Which of the following is a long-term budget?","options":["Master Budget","Flexible Budget","Cash Budget","Capital Budget"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":257,"q":"Materials become key factor, if","options":["quota restrictions exist","insufficient advertisement prevails","there is low demand","there is no problem with supplies of materials"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":258,"q":"The difference between fixed cost and variable cost assumes significance in the preparation of the following budget:","options":["Master Budget","Flexible Budget","Cash Budget","Capital Budget"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":259,"q":"The budget that is prepared first of all is _________.","options":["Master budget","Sales budget assuming that it is the key factor","Cash Budget","Capital expenditure budget"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":260,"q":"Sales budget is a ________ .","options":["expenditure budget","functional budget","master budget","None of these"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":261,"q":"When a company wants to prepare a factory overhead budget in which the estimated costs are directly derived from the estimates of activity levels, which of the following budget should be prepared by the company?","options":["Flexible budget","Fixed budget","Master budget","R & D budget"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":262,"q":"Which of the following budgets facilitates classification of fixed and variable costs:","options":["Capital expenditure budget","Flexible budget","Cash budget","Raw materials budget"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":263,"q":"The entire budget organisation is controlled and headed by a senior executive known as:","options":["General Manager","Accountant","Budget Controller","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":264,"q":"A flexible budget requires a careful study of","options":["Fixed, semi-fixed and variable expenses","Past and current expenses","Overheads, selling and administrative expenses","None of these."],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":265,"q":"The basic difference between a fixed budget and flexible budget is that a fixed budget ____________.","options":["is concerned with a single level of activity, while flexible budget is prepared for different levels of activity","Is concerned with fixed costs, while flexible budget is concerned with variable costs","is fixed while flexible budget changes","None of these"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":266,"q":"Which of the following is not a reason for an idle time variance?","options":["Wage rate increase","Machine breakdown","Illness or injury to worker","Non- availability of material"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":267,"q":"During September, 300 labour hours were worked for a total cost of Rs. 4800. The variable overhead expenditure variance was Rs. 600 (A). Overheads are assumed to be related to direct labour hours of active working. What was the standard cost per labour hour?","options":["Rs. 14","Rs. 16.50","Rs. 17.50","Rs. 18"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":268,"q":"Which of the following would explain an adverse variable production overhead efficiency variance? 1. Employees were of a lower skill level than specified in the standard 2. Unexpected idle time resulted from a series of machine breakdown 3. Poor Quality material was difficult to process","options":["(1), (2) and (3)","(1) and (2)","(2) and (3)","(1) and (3)"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":269,"q":"Budgeted sales of X for March are 18000 units. At the end of the production process for X, 10% of production units are scrapped as defective. Opening inventories of X for March are budgeted to be 15000 units and closing inventories will be 11,400 units. All inventories of finished goods must have successfully passed the quality control check. The production budget for X for March, in units is:","options":["12960","14400","15840","16000"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":270,"q":"CG Co manufactures a single product T. Budgeted production output of product T during Jun
