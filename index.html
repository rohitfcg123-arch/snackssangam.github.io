<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14213D">
  <title>CMA Zone</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">C</span>
      <div>
        <strong>CMA Zone</strong>
        <span class="brand-subtitle">CMA Preparation</span>
      </div>
    </div>
  </header>

  <main class="foundation-page">
    <section class="welcome-card">
      <p class="eyebrow">CMA ZONE</p>
      <h1>Your CMA preparation, kept simple.</h1>
      <p class="welcome-text">
        Open Study, tap the subject you are studying, and let CMA Zone track your time automatically.
      </p>
      <a class="primary-button primary-link" href="pages/study.html">
        Start Study
      </a>
    </section>

    <section class="status-card" aria-live="polite">
      <span class="status-dot"></span>
      <div>
        <strong>Study Tracker V1 ready</strong>
        <p>Subject-first tracking is now available for testing.</p>
      </div>
    </section>
  </main>
</body>
</html>
