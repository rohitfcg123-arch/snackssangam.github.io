ge":""},{"id":10,"q":"Which of the following is/are revenue expenditure?","options":["Consumable Stores","Taxes and legal expenses","Rent of factory building","All of Above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":11,"q":"Which of the following purpose is served from the preparation of Trial Balance?","options":["To check the arithmetical accuracy of the recorded transactions","To ascertain the balance of any ledger account","To facilitate the preparation of final accounts promptly","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":12,"q":"The basic principles of concept is that business is assumed to exist for an indefinite period _______________.","options":["Going Concern","Business Entity","Money Measurement","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":13,"q":"Purchase of a laptop for office use wrongly debited to Purchase Account. It is an error of _____________________.","options":["Omission","Commission","Principle","Misposting"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":14,"q":"Which of the following book is both a journal and a ledger?","options":["Cash Book","Sales Day Book","Bills Receivable Book","Journal Proper"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":15,"q":"Original cost of a machine is ₹ 1,50,000, residual value ₹10,000, if depreciation is charged @ 10% per annum under WDV method then depreciation for 3rd year will be_______________.","options":["₹ 12,240","₹ 11,340","₹ 12,150","₹ 14,000"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":16,"q":"Cost of Machine B is ₹90,000, Expenses incurred at the time of purchase to be capitalized is ₹10,000. Estimated Residual Value of Machine B is ₹20,000. Expected Useful Life is 8 years.Compute the amount depreciations under SLM method.","options":["10,000","₹ 20,000","₹ 15,000","₹ 5,000"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":17,"q":"If Capital on 01.01.2023 was ₹24,000. Capital on 31.12.2023 is was ₹12,000. Profit /(Loss) during the year was ₹6,000 and Fresh Capital introduced was ₹1,200 Then the amount of drawings was ____________.","options":["₹ 7,200","₹ 12,000","₹ 25,200","₹ 19,200"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":18,"q":"Journal entry of wages ₹10,000 paid for installation of machinery will be ________________.","options":["Dr.Wages A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery A/c and Cr. Cash A/c with ₹10,000","Dr.Machinery repairs A/c and Cr. Cash A/c with ₹10,000","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":19,"q":"Credit balance of a nominal account shows ______________","options":["Expenses of the business","Loss in the business","Income in the business","Asset of the business"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":20,"q":"Which of the following will be recorded as Contra Entry in a Cash Book?","options":["₹1,000 withdrawn from bank for personal use","Cheque of ₹2,000 received from Mr.X lodged into bank on the same day","Cheque of ₹3,000 received before from Mr.Y and now lodged into bank","A customer directly deposited ₹4,000 in the bank account of the business"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":21,"q":"Goods purchased costing ₹60,000 and cash paid ₹45,000 after receipt of a cash discount of ₹9,000. What is the percentage of trade discount got?","options":["15%","10%","7.50%","25%"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":22,"q":"Which of the following errors in an error of omission?","options":["Sale ₹5,000 written in the purchase journal","Wages paid to Shyam debited to his account","The total of the sales journal has not been posted to the sales account","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":23,"q":"A credit sale of goods to Amir, worth ₹600 was recorded in Purchase Book. In the rectification entry ___________.","options":["Amir will be debited by ₹600","Purchase will be debited by ₹600","Amir will be debited by ₹1,200","Sales will be credited by ₹1,200"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":24,"q":"Purchase of machinery worth ₹5,000 was omitted from accounts. The rectification entry is _________________.","options":["Purchase A/c will be debited","Cash A/c will be credited","Machinery A/c will be credited","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":25,"q":"Goods purchased from A for ₹2,000 passed through sales book. The rectification of this error results in ________________.","options":["Decrease in Gross Profit","No effect on Gross Profit","Increase in Gross Profit","Increase in Sundry Debtors"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":26,"q":"The Accommodation bill is drawn","options":["to finance actual purchase or sale of goods.","to facilitate trade transmission.","when both parties are in need of funds.","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":27,"q":"If any stock is taken by a co-venturer, it will be treated as","options":["an income of the joint venture","an expense of the joint venture","to be ignored from joint venture","it will be treated in the personal books of the co-venturer"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":28,"q":"Kuntal draws a bill on shyam for Rs. 7,000.Kuntal endorsed it to Ram. Ram endorsed it to Rahim. The payee of the bill will be:","options":["Kuntal","Ram","Shyam","Rahim"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":29,"q":"A and B purchased a piece of land for ₹30,000 and sold it for ₹60,000 in 2022. Originally A had contributed ₹12,000 and B ₹8,000. The profit on venture will be___________.","options":["₹ 30,000","₹ 20,000","60,000","₹ 10,000"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":30,"q":"Which of the following is/ are the basic features of a Joint Venture","options":["The profit or loss on joint venture is shared between the co-venturers in the agreed ratio","The co-venturers may or may not contribute initial capital","The JV is dissolved once the purpose of the business is over","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":31,"q":"The person to whom bill is endorsed is known as _______________.","options":["Endorsee","Drawee","Drawer","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":32,"q":"A and B enter into a joint venture sharing profit and losses in the ratio of 3:2. A purchased goods costing ₹2,00,000. B sold 95% goods for ₹2,50,000. A is entitled to get 1% commission on purchase and B is entitled to get 5% commission on sales. A drew a bill on B for an amount equivalent to 80% of original cost of goods. A got it discounted at ₹1,50,000. What is A's share of profit?","options":["₹ 15,300","₹ 21,300","₹ 18,900","₹ 15,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":33,"q":"Which of the following commission is allowed by the consignor to the consignee to encourage the consignee for putting-up hard work in introducing new product in the market?","options":["Del-credere Commission","Over-riding Commission","Hard work Commission","Ordinary Commission"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":34,"q":"X draws a bill on Y for ₹ 1,80,000 for mutual accommodation in the ratio of 2:1. X got it discounted for ₹1,69,200 and remitted 1/3rd of the proceeds to Y. How much money should be remitted by X to Y at the time of maturity so as to enable Y to honour the bill?","options":["₹ 120,000","₹ 115,200","₹ 116,800","₹ 120,400"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":35,"q":"Raju draws a bill on Sampat on 25th October, 2021 for 90 days, the maturity date of the bill will be_____________.","options":["27th January, 2022","26th January, 2022","25th January, 2022","28th January, 2022"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":36,"q":"Which class of account is Consignment Account?","options":["Personal Account","Real Account","Representative Personal Account","Nominal Account"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":37,"q":"On dishonor of a bill of exchange that has been discounted, noting charges are initially paid by .","options":["Bank","Drawer","Drawee","Acceptor"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":38,"q":"Miss V draws a genuine trade bill of ₹25,000 for 6 months on Mr. M. After holding the bill for 1.5 months, as a result of unexpected requirement of cash, she immediately discounts the bill with the bank@ 10% p.a. The amount of the discount on bill is_____________________.","options":["₹ 1,250","₹ 2,500","₹ 937.50","₹ 625"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":39,"q":"On January 01, 2023, Mr. S drew a six months bill on Mr. H for ₹15,000 for mutual accommodation and the bill was duly accepted by Mr. H. Mr. S discounted the bill on the same day with a bank at 10% p.a. and remitted one third proceeds to Mr. H. The discount to be borne by Mr. S is___________________.","options":["₹ 1,000","₹ 500","₹ 750","₹ 1,250"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":40,"q":"A proforma invoice is sent by _________________.","options":["Consignee to Consignor","Consignor to Consignee","Debtors to Consignee","Debtors Consignor"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":41,"q":"The nature of Consignment A/c and Consignee's A/c will be ___________","options":["nominal and personal respectively","real and nominal respectively","personal and real respectively","nominal and real respectively"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":42,"q":"K of Kolkata sends out 400 bags of jute to T of Tamilnadu costing ₹200 each. Consignor expenses ₹2,000. Y's non-selling expenses is ₹2,000 and selling expenses is ₹1,000. 300 bags were sold by Y. Value of consignment stock is_____________.","options":["₹ 20,400","₹ 20,200","₹ 22,000","₹ 21,000"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":43,"q":"Goods will be sent on consignment at invoice price which is 20% above cost. 1/5th of the goods costing ₹60,000 were damaged in transit. Find out invoice price of the goods sent on consignment basis.","options":["₹ 375,000","₹ 300,000","₹ 360,000","None of these"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":44,"q":"X of Kolkata sends out 100 boxes to Y of Delhi costing ₹200 each. Consignor's expenses : ₹4,000 . Consignee's expenses: non-selling ₹900 and selling ₹500. 1/10th of the boxes were lost in transit. 2/3rd of the boxes received by consignee were sold. The amount of consignment stock will be ________________.","options":["₹ 7,200","₹ 7,500","₹ 7,000","₹ 6,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":45,"q":"A sends out goods costing ₹2,00,000 to B. Consignor's expenses ₹5,000. Consignor's expenses in relation to sales ₹3,000. 4/5th of goods were sold at 20% above cost. The profit on consignment will be____________.","options":["₹ 25,000","₹ 31,000","₹ 25,200","(₹5,000)"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":46,"q":"X of Kolkata send out certain goods at cost + 25%. Invoice value of goods sends out ₹2,00,000. 4/5th of the goods were sold by consignee at ₹1,76,000. Commission 2% upto invoice value & 10% of any surplus above invoice value. Amount of commission is","options":["₹ 4,800","₹ 5,200","₹ 3,200","₹ 1,600"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":47,"q":"X of Kolkata send out goods costing ₹ 1,00,000 to Y of Delhi. 3/5th of the goods were sold by consignee for Rs. 70,000. Commission exceeds cost price. The amount of Commission will be:","options":["₹ 2,833","₹ 2,900","₹ 3,000","₹ 2,800"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":48,"q":"Any account sale is the periodical summary statement sent by the _______ to the _______","options":["Consignor, Consignee","Consignee, Consignor","Buyer, Seller","Seller, Buyer"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":49,"q":"Account sales __________",
