lisation approach","options":["Capitalisation of Average Profits","Capitalisation of Super Profits","Both 1 and 2","Capitalisation of Average Future maintainable profit"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":28,"q":"The major bases of asset valuation for a going concern:","options":["Book Value","Net Replacement Value","Net Realisable Value","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":29,"q":"Capital Employed is Rs.255 Lakhs; Annual average profits are Rs.57 Lakhs; Normal rate of return is 12%. The value of goodwill on the basis of Capitalization of super profits will be","options":["Rs.220 Lakhs","Rs.475 Lakhs","Rs.6.84 Lakhs","Rs.26.40 Lakhs"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":30,"q":"A firm values goodwill under 'Capitalisation of Profits' method Average profit of the firm for past 4 years has been determined at Rs.1,00,000 (before tax). Capital employed in the business is Rs.4,80,000 and its normal rate of return is 12%. Tax rate is 28% on average. Value of Goodwill based on capitalisation of average profit will be:","options":["Rs.1,20,000","Rs.6,00,000","Rs.5,00,000","Rs.4,80,000"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":31,"q":"The Indian Accounting Standards relevant for recognition, measurement and disclosure of financial instruments are","options":["Financial instruments: Presentation (Ind AS 32)","Financial instruments: Disclosure (Ind AS 107)","Financial instruments: (Ind AS 109)","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":32,"q":"An___ is any contract that evidences a residual interest in the assets of an entity after deducting all of its liabilities","options":["Equity instrument","Puttable instrument","Financial instrument","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":33,"q":"Ind As 109 deals with","options":["Recognition and measurement of financial instruments and hedge accounting","Presentation of financial ins e amount has been revised at Rs.44 lakhs. Effective annual interest rate for such a loan is determined at 6% p.a. The loan processing cost was Rs.2 lakhs. X Ltd’s accountant suggested to compute the amount to be charged as processing cost to the first year in the Profit and Loss A/c. Compute.","options":["Rs.40 Lakhs","Rs.2 Lakhs","Rs. 42 Lakhs","None of these"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":42,"q":"The Indian Accounting Standards relevant for recognition, measurement and disclosure of financial instruments are ______________","options":["Financial instruments: Presentation (Ind AS 32)","Financial instruments: Disclosure (Ind AS 107)","Financial instruments: (Ind AS 109)","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":43,"q":"Financial assets are ___________","options":["cash","an equity instrument of another entity","a contractual right","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":44,"q":"Ind AS 109: Financial Instruments classifies the financial assets and financial liabilities into the following categories for recognition and measurement _____________","options":["Measured at fair value thought OCI","Measured at amortized cost","Measured at fair value through P & L","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":45,"q":"Ind As 109 deals with _____________","options":["recognition and measurement of financial instruments and hedge accounting","presentation of financial instruments","disclosure of financial instruments","None of these"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":46,"q":"An _______________ is any contract that evidences a residual interest in the assets of an entity after deducting all of its liabilities.","options":["equity instrument","puttable instrument","financial instrument","None of these"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":47,"q":"Fair value is the amount for which an asset could be exchanged, or a liability settled, between knowledgeable, willing parties in an _____________.","options":["fair transaction","influenced transaction","arm’s length transaction","All of these"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":48,"q":"A Ltd. acquires 80% of B Ltd. for Rs. 12,80,000 paid by equity at par.","options":["Rs.3,00,000","Rs.3,80,000","Rs.4,50,000","Rs.5,60,000"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":49,"q":"A Ltd. acquires 80% of B Ltd. for Rs.10,00,000 paid by equity at par. F","options":["Rs.3,00,000","Rs.2,80,000","Rs.4,50,000","Rs.5,00,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":50,"q":"On 1 January 2023 A Ltd. acquires 80 per cent of the equity interests of B Ltd in exchange of cash of Rs.600 lakhs. The identifiable assets are measured at Rs. 925 lakh and the liabilities assumed are measured at Rs.150 lakh. The fair value of the 20 per cent non-controlling interest in P is Rs.90 lakhs. The gain on bargain purchase will be -","options":["Rs.90 Lakhs","Rs.85 Lakhs","Rs.105 Lakhs","Rs.75 Lakhs"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":51,"q":"A Ltd. takes over B Ltd. for Rs. 12,60,000. Fair Value (FV) of B’s net assets at time of acquisition amounts Rs. 11,80,000. Calculate Goodwill.","options":["Rs. 12,60,000","Rs.80,000","Rs. 11,80,000","None of these"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":52,"q":"Q Ltd. acquired a 60% interest in R Ltd. on January 1, 2023. Q Ltd. paid Rs. 900 Lakhs in cash for their interest in R Ltd. The fair value of R Ltd.’s assets is Rs. 2,000 Lakhs, and the fair value of its liabilities is Rs. 1,000 Lakhs. If NCI is valued at proportionate net asset, value of Goodwill:","options":["Rs. 300 Lakhs","Rs.250 Lakhs","Rs.400 Lakhs","Rs. 350 Lakhs"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":53,"q":"On March 31, 201X, A Ltd absorbed B Ltd. A Ltd. issued 60,000 equity shares (Rs.10 par value) that were trading at Rs.25 on March 31. The book value of B’s net assets w ptions":["Rs.10 lakhs","Rs.2.10 Lakhs","Rs.12.10 Lakhs","None of these"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":58,"q":"Entity A acquired 35 % of Entity B on 01.04.2023 for Rs. 35,000. On 31.03.2024, fair value of shares of Entity B is Rs. 42,000, thus Rs.7,000 reported under OCI in 2023-24. On 01.07.2020 Entity A further acquired 40% stake in Entity B. Consideration paid is Rs. 60,000. Entity A identifies the net assets of Entity B at fair value of Rs. 1,20,000 at the acquisition date, value 35% shares at Rs. 45,000. NCI is valued at proportionate net assets. Compute the total amount to be transferred to P&L A/c of Entity A.","options":["Rs.3,000","Rs.10,000","Rs.7,000","Rs.45,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":59,"q":"On 1 January 2023 M Ltd. acquires 80 per cent of the equity interests of P Ltd. by issue of equity shares of paid-up value of Rs.200 Lakhs (market value Rs.480 Lakhs). The identifiable assets are measured at Rs.760 Lakhs and the liabilities assumed are measured at Rs.120 Lakhs. Compute Non-controlling Interest if measured at proportionate net asset value.","options":["Rs.640 Lakhs","Rs.760 Lakhs","Rs.128 Lakhs","Rs.480"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":60,"q":"On 1 January 2023 P Ltd. acquires 80 per cent of the equity interests of Q Ltd. by issue of equity shares of paid-up value of Rs.50 Lakhs (market value Rs.120 Lakhs). The identifiable assets are measured at Rs.190 Lakhs and the liabilities assumed are measured at Rs.30 Lakhs. Non-controlling Interest is measured at proportionate net asset value. Compute the amount of Gain on Bargain Purchase.","options":["Rs.8 Lakhs","Rs.160 Lakhs","Rs.190 Lakhs","Rs.32 Lakhs"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":61,"q":"A Ltd. acquires 80% shares of B Ltd. for Rs.12,80,000. Fair Value (FV) of B Ltd.’s net assets at time of acquisition amounts Rs.14,80,000. Non-Controlling Interests are recognized at fair value. Compute Non-Controlling Interests.","options":["Rs.12,80,000","Rs.3,20,000","Rs.2,56,000","Rs.10,24,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":62,"q":"The pooling of interest method is considered to involve which the following?","options":["The assets and liabilities of the combining entities are reflected at their carrying amounts","The assets and liabilities of the combining entities are reflected at their Net realisable value","No adjustments are made to reflect fair values, or recognize any new assets or liabilities","Both 1 and 3"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":63,"q":"How is non-controlling interest shown in the financial statements of the acquirer at the time of a business combination under Ind AS 103?","options":["It is shown as a liability","It is shown as an item under equity","It is not shown in balance sheet","Non-controlling interest is not recognised."],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":64,"q":"As per Ind AS 103, accounting and reporting for business combination is done under ______________.","options":["Acquisition Method","Purchase method","Pooling of interest method","None of these"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":65,"q":"When after business combination, acquiree ceases to exist, it is to be recorded in the books of the ________________in one set only, in its stand-alone accounts.","options":["acquirer","acquiree","both 1 and 2","either 1 or 2"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":66,"q":"Ind AS 103 has a wider scope than","options":["AS 15","AS 14","AS 16","AS 13"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":67,"q":"At what value is non-controlling interest recorded in the books of the Acquiree at the time of a business combination transaction under Ind AS 103?","options":["It is recognised at fair value only","It is recognised at proportionate fair value of identified net assets only","It is not recognised at all","It is recognised either at fair
