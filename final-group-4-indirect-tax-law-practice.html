window.SUBJECT_QUESTIONS=[{"id":1,"q":"Goods within the meaning of supply does not includes:","options":["Movable property","Money and securities","Actionable claim other than specified actionable claims","All of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":2,"q":"Items out of the purview of supply are provided in:","options":["Schedule I","Schedule II","Schedule III","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":3,"q":"M/s R Associates of Chennai received certain consultancy services from A Inc. of USA. Both are not related person. The services received is without any consideration. Does the same classify as supply?","options":["Yes. Being import of services in the course of business","No. Since, party to the contract are not related","On the prior approval of the Government","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":4,"q":"X Ltd. Transferred certain assets forming part of business assets. The same was transferred free of cost without any consideration as a part of corporate social responsibility (CSR). What shall be the classification of such supply? X Ltd. Not availed Input Tax Credit on such assets.","options":["Supply of goods","Supply of services","Does not qualify as supply","Supply of goods and services or both"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":5,"q":"While repairing the factory shed, few goods were also supplied along with the labour service. Whether it is a:","options":["Composite Supply","Mixed Supply","Works Contract Service","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":6,"q":"What would be the tax rate applicable in case of mixed supply?","options":["Tax rate as applicable on supply attracting the lowest rate of tax","Tax rate as applicable on supply attracting the highest rate of tax","Tax @ 28%","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":7,"q":"A person purchases a bundle of toothpaste along with Tooth brush. Toothpaste under this case is liable to GST @12% and tooth brush for instance is liable to GST @18% and is sold as a single unit for a single price. What shall be the tax rate applicable in case of such supply?","options":["18%","12%","6%","Nil"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":8,"q":"As per the CGST Act, 2017, the term “works contract” includes:","options":["Construction, fabrication, completion, erection, installation, etc. of movable property","Construction, fabrication, completion, erection, installation, etc. of immovable property","Both (a) and (b)","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":9,"q":"Which of the following are naturally bundled?","options":["Hotel provides short- term accommodation and restaurant services","Hotel provides short- term accommodation and coaching or teaching Indirect Taxes","Hotel provides short- term accommodation and repairing services of customer watches","Hotel provides short- term accommodation"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":10,"q":"What is the threshold limit of turnover in the preceding financial year for opting to pay tax under composition scheme for States other than special category States?","options":["₹20 lacs","₹10 lacs","₹50 lacs","₹1.5 crore"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":11,"q":"What is the rate applicable under CGST to a registered person being a manufacturer opting to pay taxes under composition scheme?","options":["2.50%","1%","0.50%","No composition for manufacturer"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":12,"q":"Mr. Ram, a trader in Delhi has opted for composition scheme of taxation under GST. Determine the rate of total GST payable by him under composition scheme:","options":["0.5% CGST & 0.5% SGST","2.5% CGST & 2.5% UTGST","5% IGST","5% of UTGST"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":13,"q":"Can a registered person under composition scheme claim input tax credit?","options":["Yes","No","Input tax credit on inward supply of goods only can be claimed","Input tax credit on inward supply of services only can be claimed"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":14,"q":"What will happen if the turnover of a registered person opting to pay taxes under composition scheme during the year 2024-25 crosses threshold limit?","options":["He can continue under composition scheme till the end of the financial year","He will be liable to pay tax at normal rates of GST on the entire turnover for the financial year 2024- 25","He will cease to remain under the composition scheme with immediate effect","He will cease to remain under the composition scheme from the quarter following the quarter in which the aggregate turnover exceeds threshold limit"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":15,"q":"Aggregate turnover does not include—","options":["Inward supplies on which tax is payable on reverse charge basis","Exempt supplies","Export of goods or services or both","Inter-State supplies of persons having the same PAN number"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":16,"q":"X Ltd. has provided following information for the month of January 2024: (i) Intra-State outward supply ` 8,00,000/- (ii) Inter-State exempt outward supply ₹5,00,000/- (iii) Turnover of exported goods ₹ 10,00,000/- (iv) Payment made to GTA ₹ 80,000/- (ITC not availed by GTA) Calculate the aggregate turnover of X Ltd.","options":["₹ 8 , 0 0 , 0 0 0 / -","₹ 2 3 , 8 0 , 0 0 0/-","₹23,00,000/-","₹18,00,000/-"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":17,"q":"The person was operating in regular scheme. Now in financial year 2022- 23, he wants to opt for the composition scheme. Which form he must file to provide details of the input tax credit in respect of the stock of goods held with him on the day preceding the date of opting in composition scheme?","options":["Form GST ITC-01","Form GST ITC-02","Form GST ITC-03","Form GST ITC-04"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":18,"q":"The person was operating under normal scheme, but now he wants to convert in composition scheme so which form he must file?","options":["Form GST CMP-01","Form GST CMP-02","Form GST CMP-03","Form GST CMP-04"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":19,"q":"In which form can the person file for withdrawal of composition scheme?","options":["Form GST CMP-01","Form GST CMP-02","Form GST CMP-03","Form GST CMP-04"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":20,"q":"What document shall a person under composition scheme issue to its customer?","options":["Bill of supply","Tax invoice","Invoice","Debit note"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":21,"q":"Which return must be filed by the composition dealer?","options":["GSTR-3B","GSTR-5","GSTR-4","GSTR-6"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":22,"q":"Calculate the tax to be paid by Mr. C, a composition dealer who supplied laptops being a trader from the following data: (i) Cost of purchases ₹3,00,000 plus GST 12%. (ii) Profit Margin 40% on cost of purchases.","options":["4,704","7,404","4,074","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":23,"q":"If the show cause notice in Form GST CMP-05 has been issued on 15th March 2019, then by when can the taxpayer (composition dealer) submit his reply?","options":["Within 90 days","Within 180 days","Within 15 days","Within 60 days"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":24,"q":"Service provider other than section 10 of CGST Act, 2017 can opt to pay GST under composition scheme only when","options":["whose aggregate turnover in the preceding financial year was Rs.50 lakh or below","whose aggregate turnover in the preceding financial year was Rs.150 lakh or below","whose aggregate turnover in the preceding financial year was Rs.75 lakh or below","whose aggregate turnover in the preceding financial year was below Rs.50 lakh"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":25,"q":"Under _____ section of CGST Act and _____ section of IGST Act, Government can issue a general exemption notification","options":["Section 11(1) of the CGST Act & Section 6(1) of the IGST Act","Section 6(1) of the IGST Act & Section 11(1) of the CGST Act","Section 11(2) of the CGST Act & Section 6(2) of the IGST Act","Section 11(3) of the CGST Act & Section 6(3) of the IGST Act"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":26,"q":"Under_____ section of CGST Act and _____ section of IGST Act, Government exemption by way of special order","options":["Section 11(2) of the CGST Act & Section 6(2) of the IGST Act","Section 6(2) of the IGST Act & Section 11(2) of the CGST Act","Section 11(1) of the CGST Act & Section 6(2) of the IGST Act","Section 11(3) of the CGST Act & Section 6(3) of the IGST Act"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":27,"q":"Services by a hotel, inn, guest house, club or campsite are not exempted for residential/lodging purposes—","options":["If the actual tariff for a unit of accommodation is below Rs.10,000","irrespective of tariff value for a unit of accommodation","If the actual tariff for a unit of accommodation is exactly Rs.1,000","If the actual tariff for a unit of accommodation is above Rs.1,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":28,"q":"One of the following is exempted from GST—","options":["Any business exhibition","A business exhibition in India","A business exhibition outside India","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":29,"q":"Exemption can be claimed at ______ stage even if not claimed at______ stage.","options":["Adjudication, Investigation","Investigation, Adjudication","None of the above","Any, prior"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":30,"q":"Levy of GST on Priority Sector Lending Certificate (PSLC) under","options":["Exempted supply of goods","Reverse Charge Mechanism (RCM)","Forward Charge","Partial Reverse Charge Mechanism"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":31,"q":"Mr. A, who has opted for composition levy, supplies goods worth Rs.24,300 to Mr. B and issues an invoice dated 25.09.20XX for Rs.24,300. and Mr. B pays Rs.25,000 on 1.10.20XX against such supply of goods. The excess Rs. 700 (being less than Rs.1,000) is adjusted in the next invoice for supply of goods issued on 5.01.20XX. Identify the time of supply and value of supply:","options":["For Rs.25,000 – 1.10.20XX","For Rs.24,300 – 25.09.20XX and for Rs.700 – 1.10.20XX","For Rs.24,300 – 25.09.20XX and for Rs.700 – 5.10.20XX.","(b) or (c) at the option of supplier, who has opted for composition levy"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":32,"q":"ABC Ltd has purchased for its customer 50 vouchers date 20th Aug 20XX worth ₹ 500 each from Ram Pvt. Ltd. a footwear manufacturing company. The vouchers were issued by Ram Pvt. Ltd on 20th Sep 20XX. The vouchers can be encashed at retail outlets of Ram Pvt. Ltd. The employees of ABC Ltd. enchased the same on 1st Oct 20XX. Determine the time of supply of vouchers.","options":["20th Aug 20XX","20th Sep 20XX","1st Oct 20XX","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":33,"q":"Determine the amount of GST in case of supply of service of ₹10,00,000 on 4th Sep 20XX and invoice has also been issued on the same date. The date of payment is 30th Aug 20XX. The CGST rate has been increased from 5% to 12% w.e.f. 1st Sep 20XX","options":["₹ 50,000","₹ 1,00,000","₹ 70,000","₹ 1,20,000"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":34,"q":"There was decrease in tax rate from 28% to 18% w.e.f. 1.09.2024. Which of the following rate is applicable if the supplier has not opted for composition levy and supplies goods to Customer? Further, Goods were removed from its factory on 31.08.2024; delivered at buyer place on 2.02.2024; invoice is issued on 31.08.2024 and payment is received on 4.09.2024.","options":["18% as it is lower of the two","28% as date of invoice and dispatch of goods from factory, has happened before change of rate","18% as both, payment and completion of supply, has happened after change of rate","none of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":35,"q":"Money transferred service provided to foreign entity by Indian supplier of service is intermediary service and subject to","options":["CGST & SGST","CGST & UTGST","IGST","UTGST"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":36,"q":"If RR shipping Co. located in Chennai charges ocean freight charges for transport of goods to USA for a customer located in Hyderabad, the place of supply of service will be","options":["Chennai","USA","Hyderabad","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":37,"q":"Agency fees paid to foreign banks for arranging finance is—","options":["Export of service","Import of service","Tax free service","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":38,"q":"Mr. Ram a second-hand car dealer purchased a second hand car for ₹2,50,000. He sold he same car to Mr. Lakshman for ₹3,00,000. Determine value of supply?","options":["₹ 3,00,000","₹ 2,50,000","₹ 50,000","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":39,"q":"Thomas Cook Forex Pvt. Ltd. being a registered person under GST purchased 2000 USD from M/s R Academy at the rate of INR 30 per USD. Actual exchange rate at that time was ₹70 per Dollar. RBI reference rate not available. What shall be the value of such supply","options":["₹ 1,30,000","₹ 1,40,000","₹ 2,00,000","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":40,"q":"What will be the value of supply if X & Co., supply Sony television set for ₹85000 along with the exchange of an old TV and if the price of the Sony television set without exchange is ₹1,00,000, the open market value of the Sony television set is:","options":["₹ 85,000","₹ 1,00,000","₹ 15,000","₹ 1,15,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":41,"q":"The time limit to pay the value of supply with taxes to the supplier to avail the input tax credit is ______.","options":["3 months","6 months","180 Days","Till the date of filling of annual return."],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":42,"q":"As per Rule 42(2) of the CGST Rules, 2017 where the aggregate of the amount calculated finally in respect of ineligible credit exceeds the aggregate of the amounts determined under rule 42(1)(i) and (j), such excess shall be added to the output tax liability of the registered person in the month not later than the month of_____","options":["September following the end of the financial year to which such credit relates","March following the end of the financial year to which such credit relates","June following the end of the financial year to which such credit relates","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":43,"q":"As per Rule 42(2) of the CGST Rules, 2017 where the aggregate of the amount calculated finally in respect of ineligible credit exceeds the aggregate of the amounts determined under rule 42(1)(i) and (j), such excess shall be added to the output tax liability of the registered person in the month not later than the month of September following the end of the financial year to which such credit relates and the said person shall be liable to pay _______on the said excess amount at the rate specified in sub- section (1) of Section 50 for the period starting from the1st day of April of the succeeding financial year till the date of payment","options":["interest 24% p.a.","interest 18% p.a.","interest 28% p.a.","interest 12% p.a."],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":44,"q":"Banking company or Financial Institution have an option of claiming:","options":["Eligible Credit or 50% credit","Only 50% Credit","Only Eligible credit","Eligible credit and 50% credit"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":45,"q":"An assessee obtains new registration, voluntary registration, change of scheme from composition to regular scheme and from exempted goods/services to taxable goods/services. It can avail credit on inputs lying in stock. What is the time limit for taking said credit?","options":["3 years from the date of invoice","1 years from the date of invoice","5 years from the date of invoice","None of the above"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":46,"q":"Maximum time limit for availing ITC is","options":["The date of filing of annual return","30th November of the following financial year","Earliest of above two","Later of above two."],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":47,"q":"In case of supply of plant & machinery on which ITC is taken, tax to be paid on is","options":["Amount equal to ITC availed less 5% for every quarter or part thereof","Tax on transaction value","Higher of above two","Lower of above two"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":48,"q":"Mr. C, a practicing Cost Accountant purchased 3 laptops each having tax element of ₹1,25,000 in his firm name. Two laptops he utilized in his office whereas one laptop he gifted to his sister. What is the amount of ineligible ITC?","options":["₹ 1,25,000","₹ 2,50,000","₹ 2,75,000","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":49,"q":"ABC Pvt Ltd. purchased a machinery on 15th July 2023 for ₹10 lacs on which IGST was paid @ 18%. He availed the ITC & utilized the capital goods. On 16th October 2024 he sold the machinery as second hand goods for ₹7,50,000. Calculate the amount of ITC that needs to be paid.","options":["₹ 1,26,000","₹ 1,35,000","Lower of (a) or (b)","Higher of (a) or (b)"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":50,"q":"Mr. Ajay purchased goods from Mr. Chethan, a composition dealer worth ₹100,000. Since Mr. Chethan was trader so he was supposed to pay only 1% of his turnover as his tax. The item so purchased was otherwise taxable at 12%. What is the amount of credit which Mr. Ajay is eligible to take?","options":["₹ 990","₹ 12,000","₹ 1,000","Not eligible to claim credit"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":51,"q":"What is the rate of TDS?","options":["1%","4%","5%","18%"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":52,"q":"What is the due date for payment of TDS?","options":["Last day of the month to which payment relates","Within 10 days of the subsequent month","Within 20 days of the subsequent month","Within 15 days of the subsequent month"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":53,"q":"What is the due date for issue of TDS Certificate?","options":["The date of payment of TDS","Within 10 days from the date of payment of TDS","Within 20 days from the date of payment of TDS","Within 05 days from the date of payment of TDS"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":54,"q":"Every registered person required to deduct tax at source under section 51 shall furnish return, in______, for the month in which such deductions have been made within 10 days after the end of such month.","options":["Form GSTR-5","Form GSTR-6","Form GSTR-7","Form GSTR-8"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":55,"q":"When should the e-commerce operator remit the amount of TCS to government and file the necessary returns with the government?","options":["Within 10 days after the end of the month in which such amount was collected","Within 10 days after the end of the month in which such amount was collected, but no time limit for filing the return","Within 10 days after the end of the month in which such amount was collected, but no time limit for paying the money","No time limit for both"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":56,"q":"When an e-commerce operator is required to register under GST?","options":["When he is required to collect tax at source u/s 52","When his aggregate turnover exceeds the threshold limit","It is mandatory to register irrespective of the threshold limit.","When he is required to collect tax at source u/s 52 and his aggregate turnover exceeds the threshold limit."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":57,"q":"The validity period of E-Way Bill is said to initiate when:","options":["Part A is completely filled","Part B is completely Filled","Both Parts are filled completely","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":58,"q":"E-Way bill generation facility of a person paying tax under regular scheme will be blocked if he has not furnished the returns for a consecutive period of?","options":["2 months","2 tax periods","3 tax periods","6 tax periods"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":59,"q":"What shall be the validity of E-Way bill in case of vehicles other than over dimensional cargo?","options":["One day per 200 kms.","One day per 20 kms.","Both (a) & (b)","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":60,"q":"Zero rated supply includes:","options":["Export of goods and services.","Supply of goods and services to a SEZ developer or SEZ Unit","Supply of goods and services by a SEZ developer or SEZ Unit","Both (a) and (b)"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":61,"q":"Refund application is to be filed before the expiry of ____________ from the relevant date.","options":["Two years","One year","180 days","260 days"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":62,"q":"Refund shall not be paid to the applicant if the amount of refund is less than—","options":["₹ 1,000","₹ 5,000","₹ 7,000","₹ 10,000"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":63,"q":"Refunds would be allowed on a provisional basis in case of refund claims on account of zero-rated supplies of goods and/or services made by registered persons. At what percentage, would such provisional refunds be granted?","options":["70%","65%","80%","90%"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":64,"q":"Late fee for annual return for a tax payer having an aggregate turnover up to ₹5 crore in the relevant financial year is:","options":["₹50 for everyday subject to a maximum of 0.04% of turnover in the State or Union Territory","₹100 for everyday subject to a maximum of 0.25% of turnover in the State or Union Territory","₹50 for everyday subject to a maximum of 0.50% of turnover in the State or Union Territory","₹100 for everyday subject to a maximum of 0.50% of turnover in the State or Union Territory."],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":65,"q":"Every registered person whose aggregate turnover during a financial year exceeds 2 crore rupees shall get his accounts audited and furnish a copy of audited annual accounts and a reconciliation statement, duly certified, in—","options":["Form GSTR-9","Form GSTR-9C","Form GSTR-11","Form GSTR-11A"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":66,"q":"The Appellant Authority for Advance Ruling shall comprise of :","options":["Chief Commissioner of Central tax as designated by the Board and Commissioner of State tax/ Union Territory tax, having jurisdiction over the applicant.","Principal Chief Commissioner of Central tax and Commissioner of State tax/union Territory tax, having jurisdiction over the applicant.","Two sitting High Court Judges.","None of the above."],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":67,"q":"Appeal before AAAR can be filed within how many days?","options":["30 days","60 days","90 days","120 days"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":68,"q":"As per section 69(2) of CGST Act, 2017, where a person is arrested under sub-section (1) for an offence specified under sub- section (5) of section 132, the officer authorised to arrest the person shall inform such person of the grounds of arrest and produce him before a Magistrate within__________hours:","options":["four","twenty-four","twenty-five","twenty-six"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":69,"q":"What action should be taken by an assessee to satisfy with anti-profiteering provision?","options":["Reduce rate of tax on any supply of goods or services, if such assessee has got the benefit of such reduced rate","Pass on the benefit of input tax credit, if such assessee has got such input tax credit","Both (a) and (b)","none of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":70,"q":"1,00,000 MT goods are imported for ₹10 lakh but goods actually received are 95,000 MT. In this case, value of goods liable to duty is—","options":["10,00,000","9,50,000","50,000","10,50,000"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":71,"q":"Assessable value of goods is ₹5,00,000 (US $10,000 at ₹50 per US $) as per bill of entry for warehousing and BCD is 15%. The goods were cleared from warehouse on date when BCD is 10% and rate is? ₹60 per $. IGST & GST Cess is NIL and Social Welfare Surcharge is 10%. Total duty =","options":["₹ 55,000","₹ 66,000","₹ 82,500","₹ 99,000"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":72,"q":"Calculate Free on Board value from following: Ex-factory price of exporter- ₹10,000; Expenses upto loading of goods by foreign exporter- ₹12,000. Post importation cost- ₹8000:","options":["₹ 30,000","₹ 22,000","₹ 18,000","₹ 22,250"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":73,"q":"Calculate Cost of transport/handling under Rule 10(2)(a) if FoB and insurance cost [total] is $5000:","options":["$2,500","$6,000","$1,000","None of the above"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":74,"q":"From following data, find out the assessable value of imported goods: Cost of the machine at the factory of the exporting country- $ 5,000; Transport charges incurred by the a) & (c )"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":92,"q":"The importer shall submit a monthly statement on the common portal in the Form IGCR-3 (Import of Goods at Concessional Rate of Duty) appended to these rules by the _____ day of the following month.","options":["Tenth","Twentieth","Fiftieth","Eleventh"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":93,"q":"Value of goods to be exported as gift can’t exceed ____in a licensing year","options":["₹ 7,00,000.00","₹ 10,00,000.00","₹ 50,00,000.00","₹ 5,00,000.00"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":94,"q":"Minimum value addition required to be achieved under DFIA is _____.","options":["10%","15%","20%","5%"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":95,"q":"Only projects having a minimum investment of ______in plant & machinery shall be considered for establishment as EOUs.","options":["₹1 crore","₹10 crores or above","Below ₹5 crores","₹100 crores or above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":96,"q":"Status holders shall be entitled to export freely exportable items (excluding Gems and Jewelry, Articles of Gold and precious metals) on free of cost basis for export promotion subject to an annual limit of","options":["Rupees One Crore or @2% of average annual export realization during preceding three licensing years, whichever is lower.","8% of average annual export realization during preceding 3 licencing years","2% of average annual export realization during preceding 3 licencing years","8% of average annual export realization during preceding 2 licencing years"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":97,"q":"The companies or industries flexibility to allow a maximum _____ of their employees to work from home and along with prior permission to temporarily remove goods such as laptops, computers, electronic equipment, etc., from the SEZ unit to a domestic tariff area without payment of duty.","options":["50%","100%","25%","15%"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":98,"q":"In case the developer submit the proposal to the State Government for The SEZ approval, then state government forwards this proposal to the Board of Approval (BoA) along with its recommendation within.","options":["five days","forty days","fifty-five days","forty-five days"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":99,"q":"When an SEZ supplies goods/services to a Domestic Tariff Area (DTA), it is exempt from paying taxes, although the receiver in the DTA has to pay:","options":["IGST under reverse charge mechanism (RCM).","CGST and SGST under reverse charge mechanism (RCM).","CGST and UTGST under reverse charge mechanism (RCM).","IGST under forward charge"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":100,"q":"Under GST, which of the following without consideration transactions is treated as a deemed supply under Schedule I of the CGST Act?","options":["Gift of goods by a registered person to a relative, value not exceeding ₹50,000 in a year","Transfer of business assets on cessation where input tax credit was not availed","Stock transfers between two branches in different States, where both branches are separately registered","Sale of goods at less than cost to promote brand (i.e. at discounted price)"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":101,"q":"In which of these cases is a supply outside the scope of GST (i.e. not even deemed or taxable)?","options":["Services by an employee to his employer in course of employment","Services of funeral, burial, crematorium","Actionable claims, other than lottery, betting, and gambling","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":102,"q":"A GST-registered restaurant supplies complimentary desserts (free of charge) to its customers after a qualifying spending. The cost of desserts is small compared to overall bill. Which statement is correct?","options":["This is a supply (because part of business activity) and taxable","This is not a supply because there is no consideration","This is a supply only if the value exceeds ₹5,000","This is a deemed supply only if the restaurant had claimed ITC on ingredients"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":103,"q":"Which of the following is not included in the definition of “supply” under Section 7 of the CGST Act?","options":["Sale, transfer, barter, exchange","Import of services (whether or not in course or furtherance of business)","Permanent transfer of business assets without consideration (if ITC was availed)","Services by any court or Tribunal."],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":104,"q":"X issues an invoice on 10th April for goods supplied on 5th April. He receives payment on 20th April. What is the time of supply?","options":["10th April","15th April","5th April","20th April"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":105,"q":"Which of the following statements about “addition in value by way of interest or late fee for delayed payment” is correct in respect of time of supply?","options":["Time of supply for the additional amount is the date of invoice","Time of supply for additional amount is the date of provision of service","Time of supply for additional amount is the date on which supplier receives such addition","Time of supply for additional amount is 30 days after original invoice"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":106,"q":"Where it is not possible to determine the time of supply under the usual provisions (for services), the fallback rule provides that time of supply shall be:","options":["Date on which supplier issues invoice","Date of entry in the books of account of recipient","Date of provision of service","Date of receipt of payment"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":107,"q":"Suppose rate of tax changes on 1st July. If supply is completed before change in rate, but invoice is issued after change in rate and payment also received after change, what is the time of supply?","options":["Date of payment or invoice (whichever earlier)","Date of issue of invoice","Date of supply (i.e. completion date)","Change rate date"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":108,"q":"Which of the following is correct for supply of vouchers (in case where supply is identifiable at voucher issuance)?","options":["Time of supply is date of redemption of voucher","Time of supply is date of issuance of voucher","Time of supply is date of payment by customer","Time of supply is latest of issuance or redemption"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":109,"q":"An unregistered individual based in Hyderabad contacts a travel agent in Delhi to book an international flight from Mumbai to Dubai. What is the place of supply for GST purposes?","options":["Delhi","Hyderabad","Mumbai","Dubai"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":110,"q":"Place of supply of services in relation to immovable property (e.g. hotel accommodation) is:","options":["Location of property","Location of recipient","Location of supplier","Place of payment"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":111,"q":"ABC Ltd. in Mumbai organises an event in Chennai for a registered client from Hyderabad. What is the place of supply?","options":["Mumbai","Chennai","Hyderabad","Where payment is received"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":112,"q":"A dealer gives a post-supply discount of 10% on condition that buyer meets a sales target. The condition was agreed before supply. Is this discount deductible from transaction value?","options":["No","Yes, always","Yes, if linked to invoice and reversed proportionally","Only if agreed post- supply"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":113,"q":"X Ltd. supplies goods worth ₹2,00,000 to a sister company and does not charge any price. Open market value of goods is ₹2,20,000. And the company is eli ard to next year and adjust later"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":119,"q":"In relation to non-payment to supplier within 180 days, which of the following is correct?","options":["The entire ITC taken must be reversed","ITC has to be reversed to the extent of non- payment (value + tax)","No reversal is required if the due amount is less than ₹10,000","ITC reversal is required only for capital goods, not for inputs"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":120,"q":"Which of the following statements is correct regarding input tax credit (ITC) for zero-rated supplies?","options":["ITC is allowed only if the final supply is taxable","For zero-rated supplies, ITC of inputs and input services used is allowed, even if the zero-rated supply is an exempted supply","Zero-rated supplies are exempt supplies, so no ITC is allowed","ITC is disallowed for capital goods used in zero-rated supplies"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":121,"q":"A supplier makes a supply to SEZ unit. The place of supply is determined as SEZ (inside India). The supplier furnishes LUT and ships the goods. The tax treatment is:","options":["The supply is a domestic supply taxed under CGST/SGST","The supply is inter- state IGST leviable","The supply is zero-rated (no tax)","The supply is exempt supply"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":122,"q":"Under GST, a government department is required to deduct TDS when the value of supply under a contract exceeds:","options":["₹2.5 lakh exclusive of tax","₹2.5 lakh inclusive of tax","₹5 lakh exclusive of tax","₹10 lakh inclusive of tax"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":123,"q":"If TDS is deducted under GST, the deductor must deposit the amount with the government within:","options":["7 days from the end of the month","10 days from the date of deduction","15 days from the end of the quarter","10 days from the end of the month"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":124,"q":"TCS under GST is applicable only when:","options":["Goods are sold on consignment basis","Services are provided to foreign customers","Supplies are made through an e-commerce operator","Sales exceed ₹50 lakh per annum"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":125,"q":"Which of the following does not attract TDS under GST?","options":["Intra-state supply by a supplier to a PSU","Inter-state supply to a government department","Exempt supply of goods worth ₹10 lakh","Works contract supply of ₹4 lakh to a municipality"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":126,"q":"In which of the following cases is Part B of the E-way bill not mandatory to be filled?","options":["When distance is less than 50 km and within same State","In all inter-state movement","When goods are sent for job work","When transported by railways"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":127,"q":"E-way bill generated once can be cancelled within how much time, if goods are not transported?","options":["Within 12 hours","Within 24 hours","Within 48 hours","Within 72 hours"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":128,"q":"What is the validity of an E-way bill for a distance of 750 km (other than over-dimensional cargo)?","options":["1 day","4 days","5 days","7 days"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":129,"q":"If goods are transferred from one vehicle to another in transit, what must the transporter do under E-way bill rules?","options":["Cancel the old E-way bill and generate a new one","Update Part A of the E- way bill","Update Part B of the existing E-way bill","No change is needed"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":130,"q":"Under GST, refund of unutilized ITC under inverted duty structure is allowed when:","options":["Input tax rate is less than output tax rate","Output supplies are zero-rated","Input tax rate is higher than output tax rate","Inputs are exempt but outputs are taxable"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":131,"q":"Refund under inverted duty structure is not available for:","options":["Input services","Input goods","Capital goods","Both A and C"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":132,"q":"As per latest rules, refund of ITC under inverted duty structure shall not be allowed if:","options":["The person has claimed refund on account of exports without payment of tax","Inputs and outputs are both taxable at same rate","Output supply is exempt","All of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":133,"q":"A taxpayer has opted for the QRMP scheme. What is the due date for filing GSTR-3B for the quarter ending June?","options":["20th July","22nd or 24th July depending on the state","30th June","13th July"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":134,"q":"Which of the following returns is auto-generated and helps in reconciliation of ITC for the recipient?","options":["GSTR-3B","GSTR-2A","GSTR-9","GSTR-7"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":135,"q":"The due date for filing GSTR-9 for a financial year is:","options":["31st March of next financial year","31st December of next financial year","30th September of next financial year","31st January of next financial year"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":136,"q":"GSTR-7 is a return to be filed by:","options":["A composition dealer","A non-resident taxable person","A person liable to deduct TDS under GST","An Input Service Distributor"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":137,"q":"If a registered person fails to maintain proper books of accounts, what can the proper officer do?","options":["Suspend registration immediately","Demand audit from an external agency","Determine tax liability based on best judgment","Issue a notice for cancellation of GSTIN"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":138,"q":"As per GST law, every registered person (except composition taxpayers) must maintain books of account at:","options":["Their residence","Head office only","Each place of business mentioned in the registration certificate","Only where manufacturing activity takes place"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":139,"q":"Which of the following records is not mandatorily required to be maintained under GST?","options":["Records of input and output supplies","Details of stock of goods","Audit trail of accounting software","Income Tax returns"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":140,"q":"The minimum period for which accounts and records must be retained under GST is:","options":["5 years from the date of filing annual return","8 years from the due date of filing the annual return.","6 years from the due date of filing the annual return.","8 years from the date of invoice"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":141,"q":"Filing of GSTR-9C (Reconciliation Statement) is mandatory for taxpayers having aggregate turnover:","options":["Exceeding ₹2 crore","Exceeding ₹5 crore","Less than ₹2 crore","Equal to ₹10 crore"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":142,"q":"GSTR-9C must be certified by:","options":["The taxpayer only","An independent cost accountant or chartered accountant","GST officer","Auditor appointed under Companies Act"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":143,"q":"If any short payment or excess ITC claim is discovered in GSTR-9C, what must the taxpayer do?","options":["Ignore if amount < ₹10,000","Disclose but no action needed","Pay tax along with interest via DRC-03","File revised GSTR-9"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":144,"q":"An advance ruling issued by the Authority is binding on:","options":["The applicant only","The applicant and the officer dealing with the applicant","The applicant, officer, and any other person","All registered taxpayers in the State"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":145,"q":"The maximum time within which the Authority for Advance Ruling must pronounce its ruling is:","options":["60 days from the date of application","90 days from the date of application","120 days from the date of application","30 days from the date of application"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":146,"q":"As per GST law, what is the term of the President of the National Appellate Authority for Advance Ruling (NAAAR)?","options":["Three years or until the age of 70, whichever is earlier","Three years or until the age of 65, whichever is earlier","Five years or until the age of 65, whichever is earlier","Five years or until the age of 70, whichever is earlier"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":147,"q":"During search and seizure, the GST officer must issue which document?","options":["Show Cause Notice","Arrest Memo","Panchnama","Invoice"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":148,"q":"As per Section 67 of CGST Act, an officer can inspect a place of business when:","options":["Taxpayer fails to file GSTR-9C","Commissioner has reasons to believe suppression of transactions","Supplier delays invoice issue","Annual return is filed with delay"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":149,"q":"As per Section 67(7) of the CGST Act, if goods are seized and no show cause notice is issued within what period must the seized goods be returned to the person from whom they were seized?","options":["60 days from date of seizure","30 days from date of seizure","6 months from date of seizure","3 months from seizure"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":150,"q":"If a person is arrested under GST for a cognizable offence, he must be produced before a magistrate within:","options":["48 hours","24 hours","72 hours","12 hours"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":151,"q":"Under GST, who is authorized to approve inspection or search?","o ans":1,"topic":"","subject":"","sourcePage":""},{"id":165,"q":"The customs duty becomes payable in Manufacture in Bond when:","options":["Goods are received in warehouse","Bond is executed","Goods are cleared for home consumption","Goods are exported"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":166,"q":"Under Section 74, duty drawback is allowed when:","options":["Imported goods are used for more than 3 years","Imported goods are exported as such or after use","Goods are exported under bond","No customs duty was paid at the time of import"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":167,"q":"The maximum drawback allowed under Section 74 if goods are exported without use is:","options":["98% of duty paid","90% of FOB value","50% of CIF value","Full refund of duty"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":168,"q":"All Industry Rate (AIR) of drawback is notified by:","options":["CBIC under Customs Act","Ministry of Finance under FTP","DGFT under Foreign Trade Policy","CBIC under Customs, Central Excise Duties and Service Tax Drawback Rules, 2017"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":169,"q":"Which of the following is not a valid ground for seeking remission under Customs Act?","options":["Destruction of goods in warehouse by fire","Pilferage before clearance from customs","Deterioration due to atmospheric conditions in bonded warehouse","Loss during unloading due to accident"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":170,"q":"Remission of duty under Section 23 must be claimed:","options":["Within 30 days of import","Before the goods are cleared for home consumption","After payment of duty","After physical destruction of goods"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":171,"q":"If remission is rejected, the importer can:","options":["Appeal to the Supreme Court directly","Abandon the goods without further liability","File appeal to the Commissioner (Appeals)","Export the goods without  within 1 year from import","License must be utilized within 18 months from issue"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":179,"q":"Export Promotion Capital Goods license can be transferred to another company:","options":["Only with DGFT approval","With Customs Commissioner’s approval","Not allowed under any circumstances","Freely without approval"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":180,"q":"The minimum export obligation under EPCG is generally expressed as:","options":["3 times the duty saved amount","Equal to the duty saved amount","6 times the duty saved amount","2 times the duty saved amount"],"ans":2,"topic":"","subject":"","sourcePage":""}];
