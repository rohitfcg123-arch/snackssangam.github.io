ate.","Any of the above"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":34,"q":"Which of the following appears under the heading ‘Reserve & Surplus’ in the balance sheet","options":["Share Options Outstanding Account","Share Application Money Pending Allotment","Long Term Provisions","Share Application Money due for refund"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":35,"q":"In the Balance Sheet Bank Overdraft will be shown as a liability under the heading –","options":["Other Current Liabilities","Short Term Borrowings","Current Liabilities","Cash & Cash Equivalent Liabilities"],"ans":1,"topic":"","subject":"","sourcePage":""},{"id":36,"q":"In the Balance Sheet Calls in Arrears will be shown in -","options":["Liabilities Side","Assets Side","Assets or Liabilities Side","None of the above"],"ans":0,"topic":"","subject":"","sourcePage":""},{"id":37,"q":"Futura Ltd had the following items under the head “Reserves and Surplus” in the Balance Sheet as on 31st March: (Rs. in Lakhs) Securities Premium Account - 80, Capital Reserve – 60, General Reserve – 90. The Company had an Accumulated Loss of Rs250 Lakhs on the same date. Reserves & Surplus to be disclosed in B/S is _______________","options":["Rs.250 Lakhs","Rs.230 Lakhs","Rs.20 Lakhs","Rs.(20 Lakhs)"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":38,"q":"In the Notes to Accounts a Contingent liabilities shall be classified as ____________.","options":["Claims against the company not acknowledged as debt","Guarantees","Other money for which the company is contingently liable","All of these"],"ans":3,"topic":"","subject":"","sourcePage":""},{"id":39,"q":"In case of purchase of assets under instalment payment system, instalments due after 12 months from the reporting date are shown as","options":["Current liability","Current assets","Non-current liability","Non-current assets"],"ans":2,"topic":"","subject":"","sourcePage":""},{"id":40,"q":"As per Schedule III of Companies Act 2013, while p
