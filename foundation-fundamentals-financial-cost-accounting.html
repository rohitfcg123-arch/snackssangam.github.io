","Factory overheads"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":251,"q":"Opportunity cost is—","options":["The cost that is unavoidable","The benefit foregone by choosing one alternative over another","The same as sunk cost","Always included in financial accounts"],"ans":1,"topic":"","subject":"","sourcePage":16},{"id":252,"q":"The closing stock of raw materials is valued at—","options":["Cost price or market price, whichever is higher","Cost price or market price, whichever is lower","Replacement cost","Standard cost"],"ans":1,"topic":"","subject":"","sourcePage":16}];
